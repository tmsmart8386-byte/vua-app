const keyNorm=h=>norm(h).replace(/[^a-z0-9]/g,'');
function mapHeader(h){const k=keyNorm(h);if(!k)return null;for(const [f,,al] of PROD_COLS)if(al.includes(k))return f;for(const [f,,al] of PROD_COLS)if(al.some(a=>a.length>3&&k.includes(a)))return f;return null}
function parseCSV(t){const rows=[];let r=[],c='',q=false;t=t.replace(/^﻿/,'');const sep=(t.split('\n')[0].match(/;/g)||[]).length>(t.split('\n')[0].match(/,/g)||[]).length?';':',';
  for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===sep){r.push(c);c=''}else if(ch==='\n'){r.push(c);rows.push(r);r=[];c=''}else if(ch!=='\r')c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}return rows}
const moneyIn=v=>{if(typeof v==='number')return Math.round(v);const s=String(v??'').trim();if(!s)return null;const n=Number(s.replace(/[^\d]/g,''));return isNaN(n)?null:n};
/* đọc .xlsx trực tiếp trong trình duyệt (không cần mạng): giải nén zip + đọc XML */
async function unzipEntries(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);let e=-1;for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0)throw new Error('zip');const n=dv.getUint16(e+10,true);let off=dv.getUint32(e+16,true);const out={};const td=new TextDecoder();
  for(let k=0;k<n;k++){if(dv.getUint32(off,true)!==0x02014b50)break;const method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true),nl=dv.getUint16(off+28,true),xl=dv.getUint16(off+30,true),cl=dv.getUint16(off+32,true),lo=dv.getUint32(off+42,true);
    const name=td.decode(u8.subarray(off+46,off+46+nl));out[name]={method,lo,csize};off+=46+nl+xl+cl}
  return async name=>{const f=out[name];if(!f)return null;const lnl=dv.getUint16(f.lo+26,true),lxl=dv.getUint16(f.lo+28,true);const data=u8.subarray(f.lo+30+lnl+lxl,f.lo+30+lnl+lxl+f.csize);
    if(f.method===0)return td.decode(data);const ds=new DecompressionStream('deflate-raw');return td.decode(await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer())};
}
async function readXlsxNative(buf){
  const get=await unzipEntries(buf),P=x=>new DOMParser().parseFromString(x,'application/xml');
  let sheetPath='xl/worksheets/sheet1.xml';
  try{const wb=P(await get('xl/workbook.xml')),rels=P(await get('xl/_rels/workbook.xml.rels'));const sh=wb.getElementsByTagName('sheet')[0];const rid=sh&&(sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'));
    const rel=[...rels.getElementsByTagName('Relationship')].find(r=>r.getAttribute('Id')===rid);if(rel){const t=rel.getAttribute('Target');sheetPath=t.startsWith('/')?t.slice(1):'xl/'+t.replace(/^\.\//,'')}}catch(e){}
  const ssx=await get('xl/sharedStrings.xml');const ss=ssx?[...P(ssx).getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')):[];
  const sx=await get(sheetPath);if(!sx)throw new Error('sheet');const rows=[];
  const col=r=>{const m=/^([A-Z]+)/.exec(r||'');let n=0;if(m)for(const ch of m[1])n=n*26+ch.charCodeAt(0)-64;return n-1};
  [...P(sx).getElementsByTagName('row')].forEach(row=>{const ri=Number(row.getAttribute('r'))-1;const arr=[];let ci=0;
    [...row.getElementsByTagName('c')].forEach(c=>{const r=c.getAttribute('r');if(r)ci=col(r);const t=c.getAttribute('t');const v=c.getElementsByTagName('v')[0];let val='';
      if(t==='s')val=ss[Number(v&&v.textContent)]??'';else if(t==='inlineStr'){val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('')}else if(t==='str'||t==='e')val=v?v.textContent:'';else if(t==='b')val=v&&v.textContent==='1';else val=v&&v.textContent!==''?Number(v.textContent):'';
      arr[ci]=val;ci++});rows[ri>=0?ri:rows.length]=Array.from(arr,x=>x??'')});
  return Array.from(rows,r=>r||[]);
}
async function readSheetFile(file){
  if(/\.csv$/i.test(file.name))return parseCSV(await file.text());
  if(/\.xlsx$/i.test(file.name)&&typeof DecompressionStream!=='undefined'){try{return await readXlsxNative(await file.arrayBuffer())}catch(e){console.warn('xlsx native',e)}}
  const X=await loadXlsx();const wb=X.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
  return X.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
}
function pickProductFile(){const inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls,.csv';inp.style.display='none';document.body.appendChild(inp);
  inp.addEventListener('change',async()=>{const f=inp.files[0];inp.remove();if(!f)return;toast('Đang đọc file '+f.name+'…');
    let rows;try{rows=await readSheetFile(f)}catch(e){return toast(/\.csv$/i.test(f.name)?'Không đọc được file CSV.':'Không đọc được file Excel. Kiểm tra kết nối mạng hoặc lưu file dạng CSV rồi thử lại.')}
    importPreview(f.name,rows)});inp.click()}
function importPreview(fname,rows){
  rows=(rows||[]).map((r,i)=>{const x=Array.isArray(r)?r.slice():[];x._line=i+1;return x}).filter(r=>r.some(c=>String(c??'').trim()!==''));
  let hi=rows.findIndex(r=>r.filter(c=>mapHeader(c)).length>=2);if(hi<0)return toast('Không tìm thấy dòng tiêu đề (cần ít nhất cột “Tên sản phẩm” và “Giá bán”).');
  const map=rows[hi].map(mapHeader);if(!map.includes('name'))return toast('File thiếu cột “Tên sản phẩm”.');
  const prods=all('products');const bySku={},byName={};prods.forEach(p=>{if(p.sku)bySku[String(p.sku).trim()]=p;byName[norm(p.name).trim()]=p});
  const items=[],errs=[];const seen=new Set();
  rows.slice(hi+1).forEach((r,i)=>{const o={};map.forEach((f,j)=>{if(f&&o[f]==null)o[f]=r[j]});const line=r._line;
    const name=String(o.name??'').trim();if(!name){errs.push(`Dòng ${line}: thiếu tên sản phẩm`);return}
    const sku=String(o.sku??'').trim().replace(/\.0+$/,'');const key=sku||norm(name);if(seen.has(key)){errs.push(`Dòng ${line}: trùng “${sku||name}” trong file, bỏ qua`);return}seen.add(key);
    const price=moneyIn(o.price),cost=moneyIn(o.cost),stock=moneyIn(o.stock),min=moneyIn(o.minStock);
    if(o.price!=null&&String(o.price).trim()!==''&&price==null){errs.push(`Dòng ${line}: giá bán không hợp lệ`);return}
    const ex=(sku&&bySku[sku])||byName[norm(name).trim()];
    items.push({line,ex,d:{name,sku,category:String(o.category??'').trim(),cost,price,stock,minStock:min,unit:String(o.unit??'').trim(),supplier:String(o.supplier??'').trim()}})});
  const nNew=items.filter(x=>!x.ex).length,nUp=items.length-nNew;
  const shown=items.slice(0,50);
  openSheet(`<div class="sheet-h"><h2>Nhập sản phẩm từ Excel</h2><button class="btn sm ghost" type="button" data-act="close">Đóng</button></div>
   <div class="infobox"><b>${esc(fname)}</b> · ${items.length} sản phẩm hợp lệ: <b style="color:var(--ok)">${nNew} mới</b>, <b style="color:var(--info)">${nUp} đã có</b>${errs.length?`, <b style="color:var(--bad)">${errs.length} dòng lỗi</b>`:''}.<br>Cột nhận diện: ${map.filter(Boolean).map(f=>PROD_COLS.find(c=>c[0]===f)[1]).join(', ')}.</div>
   ${errs.length?`<div class="errbox" style="max-height:110px;overflow:auto">${errs.slice(0,30).map(esc).join('<br>')}${errs.length>30?'<br>…':''}</div>`:''}
   ${nUp?`<div class="field"><label for="imp-mode">Sản phẩm đã có (trùng mã vạch hoặc tên)</label><select class="input" id="imp-mode"><option value="update">Cập nhật thông tin theo file (giữ nguyên ô để trống)</option><option value="addstock">Cập nhật thông tin và CỘNG thêm tồn kho</option><option value="skip">Bỏ qua, chỉ thêm sản phẩm mới</option></select></div>`:''}
   <div class="dt-wrap" style="max-height:340px"><table class="dt"><thead><tr><th></th><th>Mã vạch</th><th>Tên sản phẩm</th><th>Nhóm</th><th class="r">Giá vốn</th><th class="r">Giá bán</th><th class="r">Tồn</th><th>Nhà cung cấp</th></tr></thead><tbody>${shown.map(x=>`<tr style="cursor:default"><td>${x.ex?'<span class="tag" style="background:var(--info-soft);color:var(--info)">Đã có</span>':'<span class="tag ok">Mới</span>'}</td><td>${esc(x.d.sku||'—')}</td><td><b>${esc(x.d.name)}</b></td><td>${esc(x.d.category||'')}</td><td class="r">${x.d.cost!=null?money(x.d.cost):'—'}</td><td class="r">${x.d.price!=null?money(x.d.price):'—'}</td><td class="r">${x.d.stock!=null?x.d.stock:'—'}</td><td>${esc(x.d.supplier||'')}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Không có dòng hợp lệ.</td></tr>'}</tbody></table></div>
   ${items.length>50?`<span class="muted" style="font-size:12.5px">Đang xem trước 50/${items.length} dòng, khi nhập sẽ lưu tất cả.</span>`:''}
   <button class="btn primary" type="button" id="imp-go" ${items.length?'':'disabled'}>Nhập ${items.length} sản phẩm</button>`,el=>{
    const go=el.querySelector('#imp-go');go.addEventListener('click',async()=>{go.disabled=true;go.textContent='Đang nhập…';
      const mode=(el.querySelector('#imp-mode')||{}).value||'update';const sups={};all('suppliers').forEach(x=>sups[norm(x.name).trim()]=x.id);
      let add=0,upd=0,skip=0,newSup=0;
      for(const x of items){if(x.ex&&mode==='skip'){skip++;continue}
        let supplierId;if(x.d.supplier){const k=norm(x.d.supplier).trim();if(!sups[k]){sups[k]=uid();await put('suppliers',sups[k],{name:x.d.supplier});newSup++}supplierId=sups[k]}
        const d={name:x.d.name};if(x.d.sku)d.sku=x.d.sku;if(x.d.category)d.category=x.d.category;if(x.d.cost!=null)d.cost=x.d.cost;if(x.d.price!=null)d.price=x.d.price;if(x.d.minStock!=null)d.minStock=x.d.minStock;if(x.d.unit)d.unit=x.d.unit;if(supplierId)d.supplierId=supplierId;
        if(x.ex){const cur=get('products',x.ex.id)||x.ex;if(x.d.stock!=null)d.stock=mode==='addstock'?(cur.stock||0)+x.d.stock:x.d.stock;await put('products',x.ex.id,{...cur,...d});upd++}
        else{await put('products',uid(),{unit:'cái',minStock:5,stock:0,cost:0,price:0,active:true,category:'Khác',sku:'',...d,stock:x.d.stock!=null?x.d.stock:0});add++}}
      closeSheet();S.prodF='all';render();toast(`Đã nhập: ${add} mới, ${upd} cập nhật${skip?', '+skip+' bỏ qua':''}${newSup?', thêm '+newSup+' nhà cung cấp':''}`)});
  });S.sheetView=null;
}

     <div class="field"><label>Mặt hàng</label><div style="display:flex;flex-direction:column;gap:8px">${F.lines.map((l,i)=>`<div style="display:grid;grid-template-columns:minmax(0,2fr) 70px minmax(0,1fr) 34px;gap:6px;align-items:center"><select class="input" data-l="${i}" data-f="productId"><option value="">Chọn sản phẩm</option>${prods.map(p=>`<option value="${p.id}" ${l.productId===p.id?'selected':''}>${esc(p.name)} (tồn ${p.stock||0})</option>`).join('')}</select><input class="input num" data-l="${i}" data-f="qty" inputmode="numeric" value="${l.qty}" aria-label="Số lượng"><input class="input num" data-l="${i}" data-f="cost" inputmode="numeric" value="${l.cost}" aria-label="Đơn giá nhập"><button class="btn sm danger" type="button" data-rm="${i}" aria-label="Xóa dòng">×</button></div>`).join('')}</div>

      el.querySelectorAll('[data-l]').forEach(x=>x.addEventListener('change',()=>{const l=F.lines[x.dataset.l];if(x.dataset.f==='productId'){l.productId=x.value;const p=get('products',x.value);if(p&&!l.cost)l.cost=p.cost||0}else l[x.dataset.f]=numIn(x.value);draw()}));

        const code=po.code||'PN-'+pad(all('purchases').length+1).padStart(4,'0');await put('purchases',id||uid(),{...po,...F,lines,code,total:poTotal({lines})});closeSheet();toast('Đã lưu đơn '+code);S.suppV='po';render()});

async function poReceive(id){
  const po=get('purchases',id);if(!po||po.status!=='ordered')return toast('Chỉ nhận hàng cho đơn đang ở trạng thái “Đã đặt hàng”.');
  confirmSheet('Nhận hàng?',`Cộng <b>${(po.lines||[]).reduce((s,l)=>s+l.qty,0)}</b> sản phẩm vào kho và ghi chi phí nhập hàng <b>${money(poTotal(po))}</b>.`,'Nhận hàng',async()=>{
    for(const l of po.lines||[]){const p=get('products',l.productId);if(p)await patch('products',p.id,{stock:(p.stock||0)+(l.qty||0),cost:l.cost||p.cost,supplierId:p.supplierId||po.supplierId})}
    const eid=uid();await put('expenses',eid,{date:TODAY,category:'Nhập hàng',title:'Nhập hàng '+(po.code||'')+' – '+((get('suppliers',po.supplierId)||{}).name||''),amount:poTotal(po),method:'transfer',payee:(get('suppliers',po.supplierId)||{}).name||'',purchaseId:id});
    await patch('purchases',id,{status:'received',receivedAt:TODAY,expenseId:eid});toast('Đã nhập kho và ghi chi phí')});
}

  if(k==='bday')return cs.filter(c=>c.birthday&&c.birthday.slice(5,7)===TODAY.slice(5,7));

  if(k==='course')return cs.filter(c=>d.activeCourse[c.id]);if(k==='vip')return cs.filter(c=>/vip/i.test(c.tags||''));
  if(k==='new')return cs.filter(c=>c.createdAt&&daysBetween(c.createdAt,TODAY)<=30);if(k==='debt')return cs.filter(c=>d.debt[c.id]>0);return cs}

    el.querySelectorAll('#st-sh .shrow').forEach(r=>{const g=k=>r.querySelector(`[data-k="${k}"]`).value.trim();const name=g('name');if(!name)return;const start=g('start')||'08:30',end=g('end')||'17:30';if(toMin(end)<=toMin(start)){bad++;return}

}
async function replaceAll(data){

}

function reqDoc(sid,W){return get('shiftreq',`${sid}_${W}`)}
function reqDay(sid,d){const r=reqDoc(sid,weekStartOf(d));return (r&&r.days&&r.days[d])||null}
function staffPref(sid,W){const r=reqDoc(sid,W),s=get('staff',sid)||{};return {pref:r&&r.pref!=null?r.pref:(s.shiftPref||''),target:(r&&r.target)||s.targetHours||40,note:(r&&r.note)||'',has:!!r}}
function reqViolation(sid,d){const r=reqDay(sid,d);if(!r)return '';const sh=shiftOn(sid,d);if(!sh||sh.off)return '';if(r.off)return 'đã xin nghỉ ngày này';if((r.block||[]).includes(sh.id))return 'đã đăng ký không làm được '+String(sh.name).toLowerCase();return ''}
function reqSummary(sid,W){

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function proposeWeek(W,keepExisting){
  const days=[0,1,2,3,4,5,6].map(i=>addDays(W,i)),shifts=shiftsList(),staff=activeStaff();
  const len=sh=>Math.max(0,toMin(sh.end)-toMin(sh.start))/60;
  const open=Math.min(...shifts.map(s=>toMin(s.start))),close=Math.max(...shifts.map(s=>toMin(s.end)));
  const allowed=(sid,d)=>{const r=reqDay(sid,d)||{};if(r.off)return [];return shifts.filter(sh=>!(r.block||[]).includes(sh.id))};
  const needOf=(sid,d)=>{const ap=all('appointments').filter(a=>a.staffId===sid&&a.date===d&&(a.status==='booked'||a.status==='confirmed'||a.status==='arrived'));if(!ap.length)return null;return [Math.min(...ap.map(a=>toMin(a.time))),Math.max(...ap.map(a=>toMin(a.time)+apptDur(a)))]};
  const plan={},hrs={},cnt=days.map(()=>({})),warn=[];
  const info=shuffle(staff.map(s=>({s,...staffPref(s.id,W)})));
  const setP=(sid,i,val)=>{const prev=plan[sid][days[i]];if(prev&&prev!=='off'){hrs[sid]-=len(shiftById(prev));cnt[i][prev]--}plan[sid][days[i]]=val;if(val!=='off'){hrs[sid]+=len(shiftById(val));cnt[i][val]=(cnt[i][val]||0)+1}};
  info.forEach(x=>{plan[x.s.id]={};hrs[x.s.id]=0;
    if(keepExisting)days.forEach((d,i)=>{const v=rosVal(x.s.id,d);if(v&&(v==='off'||(shiftById(v)&&!reqViolation(x.s.id,d))))setP(x.s.id,i,v)})});
  info.forEach(x=>{const sid=x.s.id;
    const free=days.map((d,i)=>i).filter(i=>!plan[sid][days[i]]&&allowed(sid,days[i]).length);
    const noOffReq=days.every(d=>!(reqDay(sid,d)||{}).off)&&!days.some(d=>plan[sid][d]==='off');
    let maxWork=days.filter(d=>plan[sid][d]&&plan[sid][d]!=='off').length+free.length-(noOffReq?1:0);
    const order=shuffle(free).sort((a,b)=>(needOf(sid,days[b])?1:0)-(needOf(sid,days[a])?1:0));
    let worked=days.filter(d=>plan[sid][d]&&plan[sid][d]!=='off').length;
    order.forEach(i=>{const d=days[i],nd=needOf(sid,d);if(!nd&&(worked>=maxWork||hrs[sid]>=x.target-1))return;
      let opts=allowed(sid,d);if(nd){const cov=opts.filter(sh=>toMin(sh.start)<=nd[0]&&toMin(sh.end)>=nd[1]);if(cov.length)opts=cov}
      const rem=x.target-hrs[sid];
      const best=opts.map(sh=>({sh,sc:(x.pref===sh.id?3:0)-(len(sh)>rem?(len(sh)-rem)*0.4:0)-(cnt[i][sh.id]||0)*1.2+Math.random()*1.5})).sort((a,b)=>b.sc-a.sc)[0];
      if(best){setP(sid,i,best.sh.id);worked++}});
    days.forEach(d=>{if(!plan[sid][d])plan[sid][d]='off'});
  });
  // đảm bảo có người mở cửa và đóng cửa mỗi ngày
  days.forEach((d,i)=>{
    const covers=(t,fn)=>staff.some(s=>{const v=plan[s.id][d];const sh=v&&v!=='off'&&shiftById(v);return sh&&fn(sh)});
    [['mở cửa',sh=>toMin(sh.start)<=open],['đóng cửa',sh=>toMin(sh.end)>=close]].forEach(([lab,fn])=>{
      if(covers(lab,fn))return;
      const cand=shuffle(info).map(x=>{const sid=x.s.id,cur=plan[sid][d],opts=allowed(sid,d).filter(fn);return {x,sid,cur,opts}}).filter(c=>c.opts.length)
        .sort((a,b)=>((a.cur==='off')-(b.cur==='off'))||(hrs[a.sid]/a.x.target-hrs[b.sid]/b.x.target));
      const pick=cand.find(c=>c.cur!=='off')||cand[0];
      if(pick){const sh=pick.opts.find(o=>o.id===pick.x.pref)||pick.opts[0];setP(pick.sid,i,sh.id)}
      else warn.push(`${WD[parseYmd(d).getDay()]} ${dm(d)}: không ai đăng ký làm được giờ ${lab}`)})});
  info.forEach(x=>{const h=hrs[x.s.id];if(h<x.target-6)warn.push(`${x.s.name}: ${Math.round(h)}/${x.target} giờ (thiếu do đăng ký nghỉ hoặc không đủ ca phù hợp)`);if(h>x.target+8)warn.push(`${x.s.name}: ${Math.round(h)}/${x.target} giờ (vượt mục tiêu để đủ người mở/đóng cửa)`)});
  days.forEach(d=>{const n=staff.filter(s=>plan[s.id][d]!=='off').length;if(!n)warn.push(`${WD[parseYmd(d).getDay()]} ${dm(d)}: không có ai đi làm`)});
  return {W,plan,hrs,warn,keep:!!keepExisting};
}

    case 'auth-fill':S.authForm={u:ds.u,p:ds.p};S.authErr='';render();break;
    case 'logout':clearSession();S.auth=null;S.authForm={u:'',p:''};closeSheet();render();break;
    case 'close':closeSheet();break;
    case 'zalo':{const m=ds.msg;if(m&&navigator.clipboard){navigator.clipboard.writeText(m).then(()=>toast('Đã chép tin nhắn mẫu, dán vào Zalo để gửi'),()=>toast('Mở Zalo… (không chép được tin nhắn)'))}break}
    case 'contact':await put('contacts',`${ds.cid}_${TODAY}_${ds.kind}`,{customerId:ds.cid,kind:ds.kind,date:TODAY});toast('Đã đánh dấu đã liên hệ');break;
    case 'status':await setStatus(ds.id,ds.s);break;
    case 'appt':apptSheet(ds.id);break;
    case 'edit-appt':apptForm({id:ds.id});break;
    case 'appt-date':S.apptDate=ds.d;render();break;
    case 'appt-shift':S.apptDate=addDays(S.apptDate,Number(ds.n));render();break;
    case 'appt-staff':S.apptStaff=ds.id;render();break;
    case 'new-appt':S.navOpen=false;apptForm({customerId:ds.cid||''});break;
    case 'cal-v':S.calV=ds.v;render();break;
    case 'cal-w':S.calW=Number(ds.n)?addDays(S.calW,Number(ds.n)):weekStartOf(TODAY);render();break;
    case 'cal-staff':S.calStaff=ds.id;render();break;
    case 'cal-new':if(e.target.closest('.ev'))break;apptForm({date:ds.d,time:ds.h,staffId:S.calStaff!=='all'?S.calStaff:''});break;
    case 'ap-r':S.apR=ds.v;render();break;
    case 'ap-s':S.apS=ds.v;render();break;
    case 'cust':custSheet(ds.id);break;
    case 'cust-f':S.custF=ds.f;render();break;
    case 'new-cust':custForm();break;
    case 'edit-cust':custForm(ds.id);break;
    case 'note-add':noteForm(null,{customerId:ds.cid});break;
    case 'note-edit':noteForm(ds.id);break;
    case 'note-f':S.noteF=ds.v;render();break;
    case 'today-tab':S.todayTab=ds.v;render();break;
    case 'wait-f':S.waitF=ds.v;render();break;
    /* POS */
    case 'cart-tab':S.cartTab=ds.v;S.posQ='';render();break;
    case 'cart-add':cartAdd(ds.t,ds.id);break;
    case 'cart-qty':{const it=S.cart.items[Number(ds.i)];if(it){if(it.type==='prod'&&Number(ds.n)>0){const p=get('products',it.refId);if(p&&it.qty>=(p.stock||0)){toast('Chỉ còn '+(p.stock||0)+' trong kho.');break}}it.qty=Math.max(1,it.qty+Number(ds.n));S.cart.paid='';render()}break}
    case 'cart-rm':S.cart.items.splice(Number(ds.i),1);S.cart.paid='';render();break;
    case 'cart-method':S.cart.method=ds.m;render();break;
    case 'cart-clear':S.cart=newCart();render();break;
    case 'cart-pay':b.disabled=true;await cartPay();break;
    case 'debt-pay':debtSheet(ds.id);break;
    case 'pos-debt':closeSheet();S.cart={...newCart(),customerId:ds.cid};S.cartTab='debt';go('pos');break;
    case 'pos-course':closeSheet();S.cart={...newCart(),customerId:ds.cid};S.cartTab='pkg';go('pos');break;
    case 'pos-appt':{const ap=get('appointments',ds.id);if(!ap)break;const sv=get('services',ap.serviceId)||{};closeSheet();S.cart={...newCart(),customerId:ap.customerId,staffId:ap.staffId,appointmentId:ap.id,items:[{type:'svc',refId:ap.serviceId,name:sv.name||'Dịch vụ',price:ap.value||sv.price||0,qty:1,apptId:ap.id}]};S.cartTab='svc';go('pos');break}
    case 'inv':invoiceSheet(ds.id);break;
    case 'inv-print':{const s=get('sales',ds.id);if(s)printHTML(receiptHTML(s));break}
    case 'inv-r':S.invR=ds.v;render();break;
    case 'inv-s':S.invS=ds.v;render();break;
    /* catalog */
    case 'svc-v':S.svcV=ds.v;render();break;
    case 'prod-f':S.prodF=ds.v;render();break;
    case 'supp-v':S.suppV=ds.v;render();break;
    case 'po-f':S.poF=ds.v;render();break;
    case 'exp-r':S.expR=ds.v;render();break;
    case 'period':S.period=ds.p;render();break;
    case 'rep-print':reportExport('pdf');break;
    case 'rep-xls':reportExport('xls');break;
    case 'promo-v':S.promoV=ds.v;render();break;
    case 'camp-seg':S.camp.seg=ds.v;render();break;
    case 'camp-phones':{const l=segCustomers(S.camp.seg);if(!l.length)return toast('Nhóm này chưa có ai.');navigator.clipboard&&navigator.clipboard.writeText(l.map(c=>c.phone).join('\n')).then(()=>toast('Đã chép '+l.length+' số điện thoại'));break}
    case 'camp-all':{const l=segCustomers(S.camp.seg),pr=get('promos',S.camp.promoId);if(!l.length)return toast('Nhóm này chưa có ai.');navigator.clipboard&&navigator.clipboard.writeText(l.map(c=>c.name+' ('+c.phone+'): '+fillTpl(S.camp.tpl,c,pr?pr.code:'')).join('\n\n')).then(()=>toast('Đã chép '+l.length+' tin nhắn'));break}
    /* HR */
    case 'hr-date':S.hr.date=ds.d;go('att');break;
    case 'hr-shift':{const nd=addDays(S.hr.date,Number(ds.n));if(nd<=TODAY){S.hr.date=nd;render()}break}
    case 'hr-month':S.hr.month=ds.m;render();break;
    case 'staff':staffSheet(ds.id);break;
    case 'new-staff':staffForm();break;
    case 'edit-staff':staffForm(ds.id);break;
    case 'staff-off':S.staffOff=!S.staffOff;render();break;
    case 'staff-toggle':{const st=get('staff',ds.id);await patch('staff',ds.id,{active:st.active===false});toast(st.active===false?'Đã cho đi làm lại':'Đã chuyển sang nghỉ việc, không còn hiện khi đặt lịch');break}
    case 'att':{const cur=attDay(ds.sid,S.hr.date)||{};await setAtt(ds.sid,S.hr.date,cur.s===ds.s?{s:null}:{s:ds.s});break}
    case 'att-in':{const D=S.hr.date,cur=attDay(ds.sid,D)||{},start=shiftStartOf(ds.sid,D),tm=D===TODAY?nowHM():start;const late=tm>start;await setAtt(ds.sid,D,{in:tm,s:cur.s&&cur.s!=='present'&&cur.s!=='late'?cur.s:(late?'late':'present')});toast('Vào ca '+tm+(late?' · đi muộn':''));break}
    case 'att-out':{const D=S.hr.date,sh=shiftOn(ds.sid,D),tm=D===TODAY?nowHM():(sh&&!sh.off?sh.end:'17:30');await setAtt(ds.sid,D,{out:tm});toast('Ra ca '+tm);break}
    case 'att-all':{const D=S.hr.date;let n=0,sk=0;for(const st of activeStaff()){if(attDay(st.id,D))continue;const sh=shiftOn(st.id,D);if(sh&&sh.off){sk++;continue}await setAtt(st.id,D,{s:'present',in:shiftStartOf(st.id,D)});n++}toast((n?'Đã chấm có mặt cho '+n+' người':'Mọi người đã được chấm công')+(sk?' · bỏ qua '+sk+' người nghỉ theo lịch ca':''));break}
    case 'copy-pay':copyPayroll();break;
    case 'ros-week':S.hr.week=Number(ds.n)?addDays(S.hr.week,Number(ds.n)):weekStartOf(TODAY);render();break;
    case 'ros-brush':S.hr.brush=ds.b;render();break;
    case 'ros-cell':{const cur=rosVal(ds.sid,ds.d),B=S.hr.brush;await setRosMany([{sid:ds.sid,date:ds.d,val:cur===B?'':B}]);break}
    case 'ros-copy':{const W=S.hr.week,ch=[];activeStaff().forEach(st=>{for(let i=0;i<7;i++){const d=addDays(W,i),pv=rosVal(st.id,addDays(d,-7));if(pv&&!rosVal(st.id,d))ch.push({sid:st.id,date:d,val:pv})}});if(!ch.length){toast('Không có gì để chép: tuần trước trống hoặc tuần này đã xếp đủ.');break}await setRosMany(ch);toast('Đã chép '+ch.length+' ô từ tuần trước (giữ nguyên các ô đã xếp)');break}
    case 'ros-fill':{const W=S.hr.week,B=S.hr.brush,ch=[];activeStaff().forEach(st=>{for(let i=0;i<7;i++){const d=addDays(W,i);if(!rosVal(st.id,d))ch.push({sid:st.id,date:d,val:B})}});if(!ch.length){toast('Tuần này đã xếp đủ ca.');break}await setRosMany(ch);toast('Đã điền '+ch.length+' ô trống');break}
    case 'ros-send':copyRoster();break;
    case 'ros-propose':if(!activeStaff().length){toast('Chưa có nhân viên.');break}proposeSheet(false);break;
    case 'req-edit':reqForm(ds.sid);break;
    /* settings */
    case 'theme':await setThemePref({accent:ds.v});toast('Đã đổi giao diện');break;
    case 'theme-mode':await setThemePref({theme:ds.v});break;
    case 'logo-rm':await put('settings','main',{...settings(),logo:''});toast('Đã gỡ logo');break;
    case 'backup':backup();break;
    case 'reseed':confirmSheet('Nạp lại dữ liệu mẫu?',`Toàn bộ dữ liệu ${T().org} hiện tại sẽ được thay bằng dữ liệu mẫu. Nên sao lưu trước.`,'Nạp dữ liệu mẫu',reseed);break;
    case 'wipe':confirmSheet('Xóa toàn bộ dữ liệu?',`Mọi ${T().cust}, lịch hẹn, hóa đơn, kho… của ${T().org} sẽ bị xóa. Nên sao lưu trước. Không thể hoàn tác.`,'Xóa hết',async()=>{const keep={settings:{main:{...settings()}}};const d={};COLS.forEach(c=>d[c]=keep[c]||{});await replaceAll(d);toast('Đã xóa dữ liệu')});break;
  }}catch(err){console.error(err)}
});
document.addEventListener('dblclick',e=>{const r=e.target.closest('tr[data-act="t-row"]');if(!r)return;const T0=TABLES[r.dataset.k];if(!T0)return;const f=T0.c.open||T0.c.view||T0.c.edit;if(f){S.sel[r.dataset.k]=r.dataset.id;f(r.dataset.id)}});
document.addEventListener('input',e=>{
  const id=e.target.id||'';
  if(id.startsWith('tq-')){S.tq[id.slice(3)]=e.target.value;render();return}
  if(id==='gq'){S.gq=e.target.value;const g=$('#gres');g.innerHTML=gsearchResults(S.gq);g.hidden=!S.gq.trim();return}
  if(id==='camp-tpl'){S.camp.tpl=e.target.value;clearTimeout(S._ct);S._ct=setTimeout(render,500);return}
});
document.addEventListener('change',e=>{
  const id=e.target.id||'';
  if(id==='theme-sel'){setThemePref({accent:e.target.value});return}
  if(id==='camp-promo'){S.camp.promoId=e.target.value;const p=get('promos',e.target.value);if(p&&!S.camp.tpl.includes('{ma}'))S.camp.tpl+=' Mã ưu đãi: {ma}.';render();return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#sheet').hidden)closeSheet();else if(S.bell||S.navOpen){S.bell=false;S.navOpen=false;renderShell()}const g=$('#gres');if(g&&!g.hidden){g.hidden=true}}
  if(e.key==='Enter'&&e.target.id==='gq'){const f=$('#gres button');if(f)f.click()}
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('tr[data-act="t-row"]'))e.target.click();
  if((e.key==='/'||(e.key==='k'&&(e.ctrlKey||e.metaKey)))&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')){e.preventDefault();$('#gq').focus()}
});
applyTheme();render();connect();
})();
</script>


</body>
</html>
