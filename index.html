<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>VUA APP – Quản lý spa & nha khoa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@1,600&display=swap">
<style>
:root{
  --bg:#FBF6F8; --surface:#FFFFFF; --surface-2:#F6EEF2; --ink:#241B22; --muted:#6E6370; --line:#EEDFE6;
  --accent:#E0156B; --accent-2:#C2105C; --accent-ink:#FFFFFF; --accent-soft:#FCE7F0; --accent-tint:#FFF5F9;
  --side:#1B1D2E; --side-2:#26293D; --side-ink:#D9DBE8; --side-head:#F2C94C;
  --blush:#FBE3EC; --blush-ink:#9B2F5C;
  --ok:#23884F; --ok-soft:#E2F4E9; --warn:#A8690F; --warn-soft:#FBEFD9; --bad:#D23A36; --bad-soft:#FCE4E2;
  --info:#2D62C4; --info-soft:#E4ECFA;
  --b-green:#2E9E4F; --b-cyan:#12A5C9; --b-red:#E5483F; --b-purple:#8A2BC2; --b-blue:#2E7BE0;
  --shadow:0 10px 30px rgba(36,27,34,.12); --radius:14px;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#4a3aa7;--s7:#008300;--s8:#e34948;
}
/* ---- 10 theme accents ---- */
:root[data-accent="emerald"]{--accent:#1E7A68;--accent-2:#155E50;--accent-soft:#DDF1EA;--accent-tint:#F3FAF7;--bg:#F6FAF8;--surface-2:#EDF4F1;--line:#DCE8E3;--side:#14211D;--side-2:#1E302A;--side-head:#9FE3C9;--blush:#E2F1EC;--blush-ink:#1E6B5B}
:root[data-accent="lavender"]{--accent:#7C4DDB;--accent-2:#5F33BD;--accent-soft:#EEE7FC;--accent-tint:#F8F5FE;--bg:#F8F6FC;--surface-2:#F0ECF8;--line:#E4DDF2;--side:#1E1A2E;--side-2:#2A2540;--side-head:#F2C94C;--blush:#EEE7FC;--blush-ink:#5F33BD}
:root[data-accent="ocean"]{--accent:#1D6FD6;--accent-2:#1553A6;--accent-soft:#E2EDFB;--accent-tint:#F4F8FE;--bg:#F5F8FC;--surface-2:#EBF1F8;--line:#DCE5F0;--side:#131C2E;--side-2:#1D2940;--side-head:#7FD3FF;--blush:#E2EDFB;--blush-ink:#1553A6}
:root[data-accent="coral"]{--accent:#E8573A;--accent-2:#C4401F;--accent-soft:#FDE8E2;--accent-tint:#FFF6F3;--bg:#FDF8F6;--surface-2:#F8EFEB;--line:#F0E0D9;--side:#2A1C1A;--side-2:#3A2724;--side-head:#FFD27A;--blush:#FDE8E2;--blush-ink:#A8391F}
:root[data-accent="champagne"]{--accent:#B7862B;--accent-2:#936A1C;--accent-soft:#F7EEDB;--accent-tint:#FDFAF3;--bg:#FBF9F4;--surface-2:#F4EFE4;--line:#EAE1CF;--side:#231F17;--side-2:#322C21;--side-head:#F2D08A;--blush:#F7EEDB;--blush-ink:#7D5A17}
:root[data-accent="wine"]{--accent:#9E1B42;--accent-2:#7A1231;--accent-soft:#F7E1E8;--accent-tint:#FDF4F7;--bg:#FBF6F7;--surface-2:#F5ECEF;--line:#EBDBE0;--side:#241419;--side-2:#351E25;--side-head:#F2C94C;--blush:#F7E1E8;--blush-ink:#7A1231}
:root[data-accent="mint"]{--accent:#0E9C8A;--accent-2:#0A7A6C;--accent-soft:#DBF3EF;--accent-tint:#F2FBF9;--bg:#F5FBFA;--surface-2:#EAF5F2;--line:#D8EBE6;--side:#10231F;--side-2:#1A332D;--side-head:#FFE08A;--blush:#DBF3EF;--blush-ink:#0A6B5F}
:root[data-accent="graphite"]{--accent:#3B4252;--accent-2:#262B36;--accent-soft:#E7E9EE;--accent-tint:#F6F7F9;--bg:#F6F7F8;--surface-2:#EDEFF2;--line:#DFE2E7;--side:#15171C;--side-2:#22252D;--side-head:#E8C872;--blush:#E7E9EE;--blush-ink:#3B4252}
:root[data-accent="peach"]{--accent:#E26D8F;--accent-2:#C44F72;--accent-soft:#FCE6ED;--accent-tint:#FFF6F9;--bg:#FFF8F7;--surface-2:#FAEEEF;--line:#F2DEE2;--side:#2B2025;--side-2:#3B2D33;--side-head:#FFD1A6;--blush:#FCE6ED;--blush-ink:#A8405F}
/* ---- dark mode ---- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131318; --surface:#1C1C23; --surface-2:#25252E; --ink:#EEEAF0; --muted:#A9A2AE; --line:#33323D;
    --accent-soft:color-mix(in srgb,var(--accent) 22%,#1C1C23); --accent-tint:color-mix(in srgb,var(--accent) 8%,#1C1C23);
    --blush:color-mix(in srgb,var(--accent) 22%,#1C1C23); --blush-ink:color-mix(in srgb,var(--accent) 45%,#fff);
    --side:#0E0F16; --side-2:#1B1C27;
    --ok:#5BC48A; --ok-soft:#1C3326; --warn:#E0A94A; --warn-soft:#3A2E17; --bad:#EF7A73; --bad-soft:#3B1F1D;
    --info:#86A8F2; --info-soft:#1E2A42; --shadow:0 10px 30px rgba(0,0,0,.45);
    --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#9085e9;--s7:#008300;--s8:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131318; --surface:#1C1C23; --surface-2:#25252E; --ink:#EEEAF0; --muted:#A9A2AE; --line:#33323D;
  --accent-soft:color-mix(in srgb,var(--accent) 22%,#1C1C23); --accent-tint:color-mix(in srgb,var(--accent) 8%,#1C1C23);
  --blush:color-mix(in srgb,var(--accent) 22%,#1C1C23); --blush-ink:color-mix(in srgb,var(--accent) 45%,#fff);
  --side:#0E0F16; --side-2:#1B1C27;
  --ok:#5BC48A; --ok-soft:#1C3326; --warn:#E0A94A; --warn-soft:#3A2E17; --bad:#EF7A73; --bad-soft:#3B1F1D;
  --info:#86A8F2; --info-soft:#1E2A42; --shadow:0 10px 30px rgba(0,0,0,.45);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#9085e9;--s7:#008300;--s8:#e66767;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
svg{flex:none}
button svg,a svg,label svg,.pos-cat svg,.cart-h svg,.panel-h svg,.card-h svg,.help h3 svg{width:18px;height:18px}
/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.side{width:262px;flex:none;background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:40}
.side-brand{display:flex;gap:12px;align-items:center;padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
.logo{width:46px;height:46px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none;overflow:hidden;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 45%,transparent)}
.logo img{width:100%;height:100%;object-fit:cover}
.logo svg{width:24px;height:24px}
.side-brand b{display:block;font-size:17px;color:#fff;letter-spacing:.2px;line-height:1.2}
.side-brand small{display:block;font-size:11px;font-weight:700;color:var(--side-head);letter-spacing:.6px;text-transform:uppercase}
.side-nav{flex:1;overflow-y:auto;padding:4px 12px 14px;scrollbar-width:thin;scrollbar-color:var(--side-2) transparent}
.side-group{font-size:11px;letter-spacing:1.5px;font-weight:800;color:var(--side-head);padding:16px 10px 6px;text-transform:uppercase}
.side-nav button{display:flex;gap:11px;align-items:center;width:100%;border:0;background:transparent;color:var(--side-ink);padding:9px 12px;border-radius:10px;font-weight:500;font-size:14.5px;text-align:left;margin:1px 0}
.side-nav button svg{width:19px;height:19px;opacity:.85}
.side-nav button:hover{background:var(--side-2)}
.side-nav button[aria-current="page"]{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent)}
.side-nav button[aria-current="page"] svg{opacity:1}
.side-nav .badge{margin-left:auto;background:rgba(255,255,255,.14);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}
.side-nav button[aria-current="page"] .badge{background:rgba(255,255,255,.25)}
.side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.15)}
.side-foot .avatar{background:var(--accent);color:#fff}
.side-foot b{display:block;font-size:13.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot small{font-size:11.5px;color:var(--side-ink);opacity:.75}
.side-foot .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#fff;flex:none;padding:7px 9px}
.side-foot .role-badge{background:rgba(255,255,255,.14);color:#fff}
.side-foot>div:not(.avatar){min-width:0;flex:1}
.mode-pill{display:flex;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px;margin:12px 16px 6px}
.mode-pill button{flex:1;border:0;background:transparent;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--side-ink)}
.mode-pill button[aria-pressed="true"]{background:#fff;color:var(--side)}
.scrim{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(100deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 2px 12px color-mix(in srgb,var(--accent) 30%,transparent)}
.topbar-in{display:flex;align-items:center;gap:10px;padding:11px 22px}
.topbar .menu-btn{display:none}
.gsearch{position:relative;flex:1;max-width:440px}
.gsearch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;opacity:.85}
.gsearch input{width:100%;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:9px 16px 9px 40px;font-size:14px}
.gsearch input::placeholder{color:rgba(255,255,255,.85)}
.gsearch input:focus{outline:none;background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.6)}
.gres{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);max-height:70vh;overflow:auto;z-index:50}
.gres h4{margin:0;padding:10px 14px 4px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.gres button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:8px 14px;font-size:14px}
.gres button:hover,.gres button:focus-visible{background:var(--accent-tint)}
.gres button span{color:var(--muted);font-size:12.5px;margin-left:auto;white-space:nowrap}
.gres .empty{padding:14px}
.spacer{flex:1}
.tb-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;height:38px;padding:0 14px;font-weight:600;font-size:13.5px;white-space:nowrap}
.tb-pill select{appearance:none;border:0;background:transparent;color:#fff;font-weight:600;font-size:13.5px;padding-right:14px;cursor:pointer}
.tb-pill select option{color:#222}
.tb-round{width:38px;padding:0;justify-content:center;position:relative}
.tb-round .dotn{position:absolute;top:-4px;right:-4px;background:#FFD24A;color:#3a2a00;border-radius:99px;font-size:10.5px;font-weight:800;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.quick{border:0;background:#fff;color:var(--accent);border-radius:999px;height:38px;padding:0 16px;font-weight:700;font-size:13.5px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.bell-pop{position:absolute;right:0;top:calc(100% + 8px);width:340px;max-width:calc(100vw - 24px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;z-index:50}
.bell-pop h4{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}
.bell-pop button{display:flex;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 14px;font-size:13.5px;align-items:flex-start}
.bell-pop button:first-of-type{border-top:0}
.bell-pop button:hover{background:var(--accent-tint)}
.bell-pop i{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.content{width:100%;max-width:1320px;margin:0 auto;padding:24px 28px 56px;display:flex;flex-direction:column;gap:18px}
.tabbar{display:none}
@media (max-width:1023px){
  .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-102%);transition:transform .22s ease}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .scrim{display:block;position:fixed;inset:0;background:rgba(10,8,14,.45);z-index:35}
  .scrim[hidden]{display:none}
  .topbar .menu-btn{display:inline-flex}
  .topbar-in{padding:10px 12px;gap:8px}
  .content{padding:16px 14px 110px}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:10px}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
}
@media (max-width:760px){
  .tb-hide-sm{display:none!important}
  .quick{padding:0 12px}
  .quick .ql{display:none}
}
/* ---------- page head ---------- */
h1{font-size:26px;line-height:1.2;margin:0;text-wrap:balance;font-weight:800;letter-spacing:-.3px}
h2{font-size:16px;margin:0;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.ph{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ph-ic{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.ph-ic svg{width:26px;height:26px}
.ph h1{color:var(--accent)}
.ph p{margin:2px 0 0;color:var(--muted);font-size:14px}
.ph>.ph-t{flex:1;min-width:200px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1}
.tbtn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;font-size:14px;color:#fff;display:inline-flex;align-items:center;gap:7px;box-shadow:0 3px 10px rgba(0,0,0,.1);white-space:nowrap}
.tbtn svg{width:16px;height:16px}
.tbtn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.tbtn.add{background:var(--b-green)}.tbtn.edit{background:var(--b-cyan)}.tbtn.del{background:var(--b-red)}
.tbtn.pdf{background:var(--accent)}.tbtn.xls{background:var(--b-purple)}.tbtn.csv{background:var(--b-blue)}.tbtn.view{background:var(--b-blue)}
.tsearch{display:flex;align-items:center;gap:10px}
.tsearch label{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center;color:var(--ink)}
.tsearch label svg{width:17px;height:17px;color:var(--accent)}
.tsearch .input{flex:1}
/* ---------- data table ---------- */
.dt-wrap{border:1.5px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:12px;overflow:auto;background:var(--surface)}
.dt{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.dt th{background:var(--accent);color:#fff;text-align:left;font-weight:700;padding:12px 16px;white-space:nowrap;position:sticky;top:0;z-index:1;border-right:1px solid rgba(255,255,255,.18)}
.dt th:last-child{border-right:0}
.dt th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.dt td{padding:11px 16px;border-top:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.dt td.wrap{white-space:normal;min-width:180px}
.dt tbody tr:nth-child(even){background:var(--accent-tint)}
.dt tbody tr{cursor:pointer}
.dt tbody tr:hover{background:var(--accent-soft)}
.dt tbody tr.sel{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent)}
.dt .r{text-align:right}
.dt .b{font-weight:700}
.dt tfoot td{font-weight:800;background:var(--surface-2);border-top:2px solid var(--line)}
.dt .empty{text-align:center;padding:26px;color:var(--muted);cursor:default;white-space:normal}
.dt .money-pos{color:var(--ok);font-weight:700}
.rolechip{display:inline-block;background:var(--b-blue);color:#fff;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:700}
.dt-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
/* ---------- tiles / kpi ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.tile .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi{background:var(--surface);border:2px solid var(--k,var(--accent));border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0;cursor:pointer;text-align:left}
.kpi:hover{box-shadow:var(--shadow)}
.kpi .kh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:13.5px;color:var(--ink)}
.kpi .kh svg{width:22px;height:22px;color:var(--k,var(--accent))}
.kpi .kv{font-size:27px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .ks{font-size:12px;color:var(--muted);font-weight:500;margin-top:-4px}
/* ---------- panels & rows ---------- */
.grid2{display:grid;gap:18px}
@media (min-width:1100px){.grid2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.grid2e{display:grid;gap:18px}
@media (min-width:1000px){.grid2e{grid-template-columns:repeat(2,minmax(0,1fr))}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{color:var(--ink)}
.panel-h .ic{color:var(--accent);display:inline-flex}
.panel-h .ic svg{width:18px;height:18px}
.panel-h.accent h2{color:var(--accent)}
.panel-h .count{margin-left:auto;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--muted)}
.panel-h .dot{width:9px;height:9px;border-radius:50%;flex:none}
.panel-sub{font-size:12.5px;color:var(--muted);padding:0 16px 10px;margin-top:-4px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.list>.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-main b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-main span{font-size:13px;color:var(--muted)}
.row-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.row{flex-wrap:wrap}.row-acts{flex:1 1 100%;justify-content:flex-start}.row-acts:empty{display:none}}
.row.clickable{cursor:pointer}
.row.clickable:hover{background:var(--accent-tint)}
.empty{padding:16px;color:var(--muted);font-size:13.5px}
.time{font-weight:700;font-variant-numeric:tabular-nums;min-width:48px}
/* card with colored band header (settings) */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 20px;color:#fff;font-weight:700;font-size:16px;background:var(--band,var(--accent))}
.card-h svg{width:20px;height:20px}
.card-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.frow{display:grid;grid-template-columns:190px minmax(0,1fr);gap:14px;align-items:center}
.frow>label{font-weight:700;font-size:14px}
@media (max-width:640px){.frow{grid-template-columns:1fr;gap:6px}}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.theme-sw{border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left;font-size:13px;font-weight:600}
.theme-sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.theme-sw .pv{display:flex;height:34px;border-radius:8px;overflow:hidden}
.theme-sw .pv i{display:block}
.logo-box{width:84px;height:84px;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:12.5px;overflow:hidden;background:var(--accent-tint)}
.logo-box img{width:100%;height:100%;object-fit:contain}
/* ---------- existing module styles ---------- */
.attgrid{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.attgrid th,.attgrid td{padding:4px 3px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.attgrid thead th{font-weight:600;color:var(--muted)}
.attgrid thead th button{border:0;background:transparent;color:inherit;font:inherit;font-weight:700;display:flex;flex-direction:column;align-items:center;line-height:1.1;padding:2px 3px;border-radius:6px}
.attgrid thead th small{font-size:9.5px;font-weight:500}
.attgrid thead th.sel button{background:var(--accent);color:var(--accent-ink)}
.attgrid .sticky{position:sticky;left:0;background:var(--surface);text-align:left;padding-left:14px;padding-right:10px;font-weight:600;color:var(--ink);z-index:1}
.attgrid td span,.attkey{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;color:#fff;font-weight:700;font-size:11px}
.attgrid td i{color:var(--line);font-style:normal}
.rosgrid td{padding:3px 2px}
.rosgrid .tg{color:var(--muted);font-size:11px;font-weight:600}
.rosgrid thead th div{display:flex;flex-direction:column;align-items:center;line-height:1.1;font-weight:700;padding:2px 4px;border-radius:6px}
.rosgrid thead th.sel div{background:var(--accent);color:var(--accent-ink)}
.roscell{width:100%;min-width:62px;min-height:40px;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:5px 4px;font:inherit;font-size:12px;font-weight:700;color:var(--muted);line-height:1.15;cursor:pointer}
.roscell small{display:block;font-size:10px;font-weight:500;opacity:.9}
.roscell.on{border:1px solid transparent;background:var(--c);color:#fff}
.roscell.off{border:1px solid var(--line);background:var(--surface-2);color:var(--muted)}
.rosgrid tfoot td,.rosgrid tfoot th{font-weight:700;color:var(--muted);border-bottom:0;font-size:12px}
.rosgrid tfoot td.zero{color:var(--bad)}
.shifttag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.shifttag i{width:8px;height:8px;border-radius:50%;display:inline-block}
.shifttag.off{color:var(--muted)}
.shrow{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr)!important}
.paytable{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.paytable th,.paytable td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.paytable th:first-child,.paytable td:first-child{text-align:left}
.paytable thead th{font-size:13px;color:#fff;font-weight:700;background:var(--accent)}
.paytable tbody tr{cursor:pointer}
.paytable tbody tr:nth-child(even){background:var(--accent-tint)}
.paytable tbody tr:hover{background:var(--accent-soft)}
.paytable tfoot td{font-weight:800;background:var(--surface-2);border-bottom:0}
.paytable .net{color:var(--ok)}
/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.zalo{background:var(--info-soft);border-color:transparent;color:var(--info)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.dangerfill{background:var(--b-red);border-color:var(--b-red);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:25;box-shadow:var(--shadow);border-radius:999px;padding:13px 18px}
@media (min-width:1024px){.fab{display:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.solid{color:#fff;border:0;border-radius:8px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.st-booked{background:var(--surface-2);color:var(--muted)}
.st-confirmed{background:var(--info-soft);color:var(--info)}
.st-arrived{background:var(--warn-soft);color:var(--warn)}
.st-done{background:var(--ok-soft);color:var(--ok)}
.st-noshow{background:var(--bad-soft);color:var(--bad)}
.st-cancelled{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.tag{font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--blush);color:var(--blush-ink);white-space:nowrap}
.tag.debt{background:var(--bad-soft);color:var(--bad)}
.tag.course{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--blush);color:var(--blush-ink)}
.staff-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:1px}
.daystrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.day{flex:none;width:54px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
.day .wd{font-size:11px;font-weight:600;color:var(--muted)}
.day .dd{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.day .n{font-size:10.5px;color:var(--muted);font-weight:600}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] .wd,.day[aria-pressed="true"] .n{color:var(--accent-ink)}
.day.today:not([aria-pressed="true"]){border-color:var(--accent)}
/* forms */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px}
.frow .input{background:var(--accent-tint)}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.form{display:flex;flex-direction:column;gap:12px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.form-row3{grid-template-columns:1fr 1fr}}
.search{position:relative}
.search .input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.picker-results{border:1px solid var(--line);border-radius:10px;margin-top:6px;max-height:210px;overflow:auto;background:var(--surface)}
.picker-results button{display:flex;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:9px 12px;gap:8px;align-items:center}
.picker-results button:first-child{border-top:0}
.picker-results button:hover{background:var(--surface-2)}
.picked{display:flex;align-items:center;gap:10px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:8px 10px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 10px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 2px 6px color-mix(in srgb,var(--accent) 35%,transparent)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:500}
.errbox{background:var(--bad-soft);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.af-pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--ink)}
.af-pick>span{font-weight:600;font-size:13px;margin-right:2px}
.af-pick .chip{padding:4px 10px;font-size:12.5px}
.af-pick .chip:hover{border-color:var(--accent);color:var(--accent)}
.infobox{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.total b{font-size:20px;font-variant-numeric:tabular-nums}
.prog{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:99px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:60}
.sheet-back{position:absolute;inset:0;background:rgba(20,14,18,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.sheet>*{flex-shrink:0}
.sheet::before{content:"";width:40px;height:4px;border-radius:9px;background:var(--line);align-self:center;margin-bottom:2px}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h2{font-size:19px;flex:1;color:var(--accent)}
@media (min-width:700px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(580px,calc(100% - 32px));border-radius:18px;max-height:88%;padding:18px 22px}.sheet.wide,.sheet:has(#imp-go){width:min(920px,calc(100% - 32px))}.sheet::before{display:none}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:1024px){#toast{bottom:32px}}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:500}
/* charts */
.chart{position:relative;padding:14px 16px 10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{fill:var(--muted);font-size:12.5px;font-family:var(--font)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent)}
.chart .bar.dim{fill:color-mix(in srgb,var(--accent) 55%,var(--surface))}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .hit:hover+.bar,.chart g:hover .bar{filter:brightness(1.12)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:9px;font-size:12.5px;font-weight:600;white-space:nowrap;transform:translate(-50%,-100%);box-shadow:var(--shadow);z-index:5}
.tip small{display:block;font-weight:500;opacity:.8}
.donut-wrap{display:flex;gap:18px;align-items:center;padding:16px;flex-wrap:wrap;justify-content:center}
.donut-wrap svg{width:190px;height:190px}
.legend{display:flex;flex-direction:column;gap:7px;font-size:13px;min-width:170px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:11px;height:11px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums;padding-left:12px}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding:14px 14px 0}
.hbar{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line);font-size:14px}
.hbar:first-child{border-top:0}
.hbar .name{width:40%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{flex:1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.hbar .val{min-width:96px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
/* weekly calendar */
.cal{display:grid;grid-template-columns:74px repeat(7,minmax(118px,1fr));min-width:900px}
.cal-wrap{border:1.5px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:12px;overflow:auto;background:var(--surface);max-height:calc(100vh - 290px);min-height:420px}
.cal .ch{background:var(--accent);color:#fff;font-weight:700;padding:11px 8px;text-align:center;position:sticky;top:0;z-index:2;border-right:1px solid rgba(255,255,255,.18);font-size:14px}
.cal .ch.today{background:var(--accent-2);box-shadow:inset 0 -3px 0 #fff}
.cal .th{color:var(--accent);font-weight:700;font-size:12.5px;padding:8px;border-top:1px solid var(--line);position:sticky;left:0;background:var(--surface);z-index:1}
.cal .cc{border-top:1px solid var(--line);border-left:1px solid var(--line);min-height:64px;padding:4px;display:flex;flex-direction:column;gap:4px;cursor:copy}
.cal .cc:hover{background:var(--accent-tint)}
.cal .cc.past{background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.ev{border:1px solid;border-radius:8px;padding:4px 7px;font-size:12px;line-height:1.3;text-align:left;cursor:pointer;background:var(--surface)}
.ev b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.ev.booked{background:#E4F2FB;border-color:#9ED0EE;color:#0F5E86}
.ev.confirmed{background:#EAF7DD;border-color:#A9DB86;color:#3C6E14}
.ev.arrived{background:#FFF1DC;border-color:#F3C27A;color:#8A5300}
.ev.done{background:#DDF3E4;border-color:#86CFA0;color:#1C6B3B}
.ev.noshow{background:#FFE9DB;border-color:#F6B07E;color:#9A4A0E}
.ev.cancelled{background:#FDE3E3;border-color:#F2A3A3;color:#9A2626;text-decoration:line-through}
:root[data-theme="dark"] .ev{filter:saturate(.9) brightness(.85)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ev{filter:saturate(.9) brightness(.85)}}
.stchip{border-radius:7px;padding:6px 12px;font-size:13px;font-weight:700;color:#fff}
/* POS */
.pos{display:grid;gap:18px}
@media (min-width:1100px){.pos{grid-template-columns:minmax(0,1fr) 410px;align-items:start}}
.pos-cat{background:var(--accent);color:#fff;border-radius:8px;padding:7px 12px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;margin-top:10px}
.pos-cat:first-child{margin-top:0}
.pos-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.pitem{border:1px solid var(--line);border-radius:10px;padding:9px 11px;text-align:left;background:var(--surface);display:flex;flex-direction:column;gap:2px;min-height:62px}
.pitem:nth-child(4n+1){background:#FFF7E6;border-color:#F3DDB0}
.pitem:nth-child(4n+2){background:#EAF6FB;border-color:#BFE1EE}
.pitem:nth-child(4n+3){background:#FDEBF2;border-color:#F4C3D6}
.pitem:nth-child(4n+4){background:#EEF7EA;border-color:#C9E4BC}
:root[data-theme="dark"] .pitem{background:var(--surface-2)!important;border-color:var(--line)!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pitem{background:var(--surface-2)!important;border-color:var(--line)!important}}
.pitem b{font-size:13.5px;font-weight:700;line-height:1.25}
.pitem span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pitem:hover{box-shadow:0 0 0 2px var(--accent)}
.pitem:disabled{opacity:.45}
.cart{border:1.5px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:14px;overflow:hidden;background:var(--surface);position:sticky;top:84px}
.cart-h{background:var(--accent);color:#fff;padding:12px 16px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.cart-b{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.cart-lab{font-size:11.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.cart table{width:100%;border-collapse:collapse;font-size:13px}
.cart th{background:var(--accent-2);color:#fff;text-align:left;padding:6px 8px;font-size:12px}
.cart td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.cart .qty{display:inline-flex;align-items:center;gap:4px}
.cart .qty button{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:700;line-height:1;padding:0}
.cart .rm{border:0;background:transparent;color:var(--bad);font-weight:800;font-size:15px}
.cart .sum{display:flex;justify-content:space-between;font-size:13.5px;padding:2px 0;font-variant-numeric:tabular-nums}
.cart .sum.disc{color:var(--bad)}.cart .sum.tax{color:var(--ok)}
.cart-total{background:var(--accent);color:#fff;padding:14px 16px;text-align:center;font-size:21px;font-weight:800;letter-spacing:.3px;font-variant-numeric:tabular-nums}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini .input{padding:7px 10px;font-size:14px}
/* today tabs */
.ttabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.ttab{display:flex;flex-direction:column;justify-content:space-between;gap:8px;height:104px;padding:12px 14px;border:1.5px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:14px;background:var(--surface);color:var(--ink);text-align:left;transition:background .15s,color .15s,border-color .15s,box-shadow .15s}
.ttab-top{display:flex;justify-content:space-between;align-items:center;color:var(--accent)}
.ttab-top svg{width:22px;height:22px}
.ttab-top b{font-size:24px;font-weight:800;color:var(--ink);line-height:1}
.ttab-l{font-size:13.5px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ttab:hover,.ttab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.ttab:hover .ttab-top,.ttab:hover .ttab-top b,.ttab[aria-selected="true"] .ttab-top,.ttab[aria-selected="true"] .ttab-top b{color:#fff}
.ttab:hover:not([aria-selected="true"]){background:var(--accent-2);border-color:var(--accent-2)}

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Math.round(Number(n)||0).toLocaleString('vi-VN')+'đ';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const p=String(s||'').split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const dm=s=>{if(!s)return '';const d=parseYmd(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const daysBetween=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/864e5);
const WD=['CN','T2','T3','T4','T5','T6','T7'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const TODAY=ymd(new Date());
const toMin=t=>{const p=String(t||'0:0').split(':').map(Number);return p[0]*60+(p[1]||0)};
const initials=n=>{const w=String(n||'?').trim().split(/\s+/);return ((w.length>1?w[w.length-2][0]:'')+w[w.length-1][0]).toUpperCase()};
const firstName=n=>{const w=String(n||'').trim().split(/\s+/);return w[w.length-1]||''};
const phoneFmt=p=>String(p||'').replace(/\D/g,'').replace(/^(\d{4})(\d{3})(\d+)$/,'$1 $2 $3');
const zaloUrl=p=>'https://zalo.me/'+String(p||'').replace(/\D/g,'');
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');

const COLS=['settings','services','staff','packages','customers','appointments','courses','sales','payments','contacts','attendance','advances','roster','products','suppliers','purchases','expenses','waitlist','notes','promos','shiftreq'];
const TERMS={
  spa:{org:'Spa',customer:'Khách hàng',cust:'khách',staff:'Kỹ thuật viên',course:'Liệu trình',visit:'buổi',recall:'Lâu chưa quay lại',recallSub:'Đã quá thời gian thường quay lại, chưa có lịch mới',xung:'chị'},
  nhakhoa:{org:'Nha khoa',customer:'Bệnh nhân',cust:'bệnh nhân',staff:'Bác sĩ',course:'Phác đồ',visit:'lần',recall:'Đến hạn tái khám',recallSub:'Đã đến hạn tái khám theo dịch vụ, chưa có lịch hẹn',xung:'anh/chị'}
};
const STATUS={booked:'Đã đặt',confirmed:'Đã xác nhận',arrived:'Đang phục vụ',done:'Hoàn thành',noshow:'Không đến',cancelled:'Đã hủy'};
const METHODS={cash:'Tiền mặt',transfer:'Chuyển khoản',card:'Thẻ'};
const SOURCES=['Facebook','Zalo','Giới thiệu','Google Maps','Vãng lai','TikTok'];
/* ---------- state ---------- */
let mode='spa'; try{mode=localStorage.getItem('vua-mode')||'spa'}catch(e){}
if(!TERMS[mode]) mode='spa';
const S={tab:'dash',todayTab:'today',tq:{},sel:{},sort:{},gq:'',bell:false,navOpen:false,cartTab:'svc',posQ:'',calV:'week',calW:weekStartOf(TODAY),calStaff:'all',apR:'up',apS:'all',waitF:'waiting',noteF:'all',svcV:'svc',prodF:'all',suppV:'sup',poF:'all',invR:'month',invS:'all',expR:'month',promoV:'codes',camp:{seg:'bday',promoId:'',tpl:'{Xung} {ten} ơi, {spa} gửi {xung} lời chúc và ưu đãi đặc biệt tháng này. {Xung} ghé {spa} nhé!'},staffOff:false,data:{},ready:false,dbOk:null,apptDate:TODAY,apptStaff:'all',custQ:'',custF:'all',period:'cm',
  pos:{kind:'service',customerId:'',q:'',serviceId:'',packageId:'',saleId:'',amount:'',paid:'',method:'cash',staffId:'',note:'',newName:'',newPhone:'',adding:false},
  hr:{view:'overview',date:TODAY,month:TODAY.slice(0,7),week:weekStartOf(TODAY),brush:''},sheetView:null};
COLS.forEach(c=>S.data[c]=new Map());
S.cart={items:[],customerId:'',q:'',adding:false,newName:'',newPhone:'',staffId:'',discPct:'',promoCode:'',promoId:'',taxPct:'0',tip:'',method:'cash',paid:'',appointmentId:'',note:''};
S.auth=loadSession();S.authErr='';S.authForm={u:'',p:''};
if(S.auth)S.tab=homeTab();
let db=null, unsubs=[];
const T=()=>TERMS[mode];
const all=c=>Array.from(S.data[c].values());
const get=(c,id)=>S.data[c].get(id);
const settings=()=>get('settings','main')||{name:mode==='spa'?'Spa của bạn':'Nha khoa của bạn'};
const serviceName=id=>(get('services',id)||{}).name||'Dịch vụ';
const staffOf=id=>get('staff',id)||{name:'Chưa chọn',color:'#999'};

/* ---------- data layer ---------- */
function localKey(){return 'vua-local-'+mode}
function loadLocal(){try{const raw=JSON.parse(localStorage.getItem(localKey())||'{}');COLS.forEach(c=>S.data[c]=new Map(Object.entries(raw[c]||{}).map(([k,v])=>[k,{...v,id:k}])))}catch(e){}}
function saveLocal(){try{const o={};COLS.forEach(c=>{o[c]={};S.data[c].forEach((v,k)=>o[c][k]=v)});localStorage.setItem(localKey(),JSON.stringify(o))}catch(e){}}
function subscribe(){
  unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];
  COLS.forEach(c=>S.data[c]=new Map());S.ready=false;
  if(!db){loadLocal();
    if(!S.data.customers.size){const m0=mode;(()=>{const el=document.getElementById('seed-data');if(el){try{return Promise.resolve(JSON.parse(el.textContent))}catch(e){}}return fetch('seed.json').then(r=>r.ok?r.json():null)})().then(j=>{if(!j||m0!==mode||S.data.customers.size)return;COLS.forEach(c=>{const m=j[`ws/${mode}/${c}`]||{};S.data[c]=new Map(Object.entries(m).map(([k,v])=>[k,{...v,id:k}]))});saveLocal();render()}).catch(()=>{})}
    S.ready=true;render();return}
  const pending=new Set(COLS);
  COLS.forEach(col=>{
    const u=db.collection(`ws/${mode}/${col}`).onSnapshot(snap=>{
      const m=new Map();snap.docs.forEach(d=>m.set(d.id,{...d.data(),id:d.id}));
      S.data[col]=m;pending.delete(col);if(!pending.size)S.ready=true;scheduleRender();
    },err=>toast('Mất kết nối dữ liệu ('+(err&&err.code)+'). Tải lại trang để thử lại.'));
    unsubs.push(u);
  });
}
async function put(col,id,obj){
  const body={...obj};delete body.id;
  if(db){
    try{await db.doc(`ws/${mode}/${col}/${id}`).set(body)}
    catch(e){toast(e&&e.code==='invalid_argument'?'Bạn chỉ có quyền xem, không lưu được thay đổi.':'Chưa lưu được, thử lại sau giây lát.');throw e}
  }else{S.data[col].set(id,{...body,id});saveLocal();scheduleRender()}
}
async function patch(col,id,part){const cur=get(col,id)||{};return put(col,id,{...cur,...part})}
async function connect(){
  try{const c=window.claude;db=(c&&typeof c.use==='function')?await c.use('db'):null}catch(e){db=null}
  S.dbOk=!!db;subscribe();
}

/* ---------- derived ---------- */
function derive(){
  const appts=all('appointments'),courses=all('courses'),sales=all('sales');
  const last={},future={},debt={},activeCourse={},visits={},spent={};
  appts.forEach(a=>{
    if(a.status==='done'){if(!last[a.customerId]||a.date>last[a.customerId].date)last[a.customerId]=a;visits[a.customerId]=(visits[a.customerId]||0)+1}
    if((a.status==='booked'||a.status==='confirmed')&&a.date>=TODAY)future[a.customerId]=true;
  });
  sales.forEach(s=>{const d=(s.total||0)-(s.paid||0);if(d>0)debt[s.customerId]=(debt[s.customerId]||0)+d;spent[s.customerId]=(spent[s.customerId]||0)+(s.paid||0)});
  courses.forEach(c=>{if((c.total||0)-(c.used||0)>0)(activeCourse[c.customerId]=activeCourse[c.customerId]||[]).push(c)});
  return {last,future,debt,activeCourse,visits,spent};
}
function contacted(cid,kind){return !!get('contacts',`${cid}_${TODAY}_${kind}`)}


function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function statusPill(s){return `<span class="pill st-${s}">${STATUS[s]||s}</span>`}
function custName(id){if(!id)return 'Khách lẻ';return (get('customers',id)||{}).name||'(đã xóa)'}
function xung(c){return (c&&c.xung)||T().xung}

/* ---------- messages ---------- */
function msg(kind,c,extra){
  const x=xung(c),fn=firstName(c&&c.name),org=settings().name,X=x.charAt(0).toUpperCase()+x.slice(1);
  switch(kind){
    case 'remind':return `${X} ${fn} ơi, ${org} xin nhắc lịch hẹn ${extra.service} lúc ${extra.time} ngày ${dm(extra.date)}. ${X} xác nhận giúp em nhé, em cảm ơn ${x}!`;
    case 'low':return `${X} ${fn} ơi, ${T().course.toLowerCase()} ${extra.name} của ${x} còn ${extra.rem} ${T().visit}. Em giữ lịch ${T().visit} tiếp theo cho ${x} nhé? ${org} đang có ưu đãi gia hạn cho khách thân ạ.`;
    case 'nonext':return `${X} ${fn} ơi, đã ${extra.days} ngày ${x} chưa quay lại ${extra.name} (còn ${extra.rem} ${T().visit}). Tuần này ${x} rảnh hôm nào để em xếp lịch ạ?`;
    case 'recall':return mode==='spa'?`${X} ${fn} ơi, lâu rồi ${org} chưa được gặp ${x}. Tháng này ${org} có ưu đãi cho khách quen, ${x} ghé chăm sóc nhé!`:`${X} ${fn} ơi, đã đến hạn tái khám ${extra.service}. ${X} đặt lịch giúp ${org} để bác sĩ kiểm tra định kỳ nhé!`;
    case 'bday':return `Chúc mừng sinh nhật ${x} ${fn}! ${org} gửi tặng ${x} ưu đãi 20% cho một dịch vụ bất kỳ trong tháng sinh nhật ạ.`;
    case 'debt':return `${X} ${fn} ơi, ${org} xin gửi thông tin: ${x} còn ${money(extra.amount)} chưa thanh toán. ${X} tiện chuyển khoản hoặc thanh toán ở lần hẹn tới giúp em nhé!`;
  }return '';
}
function zaloBtns(c,text,kind){
  return `<a class="btn sm zalo" href="${esc(zaloUrl(c.phone))}" target="_blank" rel="noopener" data-act="zalo" data-msg="${esc(text)}">Nhắn Zalo</a>`+
   (kind?`<button class="btn sm" type="button" data-act="contact" data-cid="${c.id}" data-kind="${kind}">Xong</button>`:'');
}

/* ---------- TODAY ---------- */
function todayData(){
  const d=derive(),t=T();
  const appts=all('appointments'),custs=all('customers');
  const todays=appts.filter(a=>a.date===TODAY&&a.status!=='cancelled').sort((a,b)=>toMin(a.time)-toMin(b.time));
  const revToday=all('payments').filter(p=>p.date===TODAY).reduce((s,p)=>s+(p.amount||0),0);
  const tomorrow=addDays(TODAY,1);
  const remind=appts.filter(a=>a.date===tomorrow&&a.status==='booked').sort((a,b)=>toMin(a.time)-toMin(b.time));
  const low=[],nonext=[];
  all('courses').forEach(c=>{
    const rem=(c.total||0)-(c.used||0);const cu=get('customers',c.customerId);if(!cu||rem<=0)return;
    if(rem<=2&&!contacted(cu.id,'low'))low.push({c,cu,rem});
    const lastD=d.last[cu.id]?d.last[cu.id].date:c.startDate;
    if(!d.future[cu.id]&&lastD&&daysBetween(lastD,TODAY)>=7&&!contacted(cu.id,'nonext'))nonext.push({c,cu,rem,days:daysBetween(lastD,TODAY)});
  });
  const recall=[];
  custs.forEach(cu=>{
    const la=d.last[cu.id];if(!la||d.future[cu.id]||d.activeCourse[cu.id])return;
    const sv=get('services',la.serviceId)||{};const rd=sv.recallDays||(mode==='spa'?30:180);
    const since=daysBetween(la.date,TODAY);
    if(since>=rd-3&&!contacted(cu.id,'recall'))recall.push({cu,since,service:sv.name||'định kỳ'});
  });
  recall.sort((a,b)=>b.since-a.since);
  const bday=custs.filter(cu=>{if(!cu.birthday)return false;const b=parseYmd(cu.birthday);for(let i=0;i<=7;i++){const x=parseYmd(addDays(TODAY,i));if(x.getDate()===b.getDate()&&x.getMonth()===b.getMonth())return true}return false}).filter(cu=>!contacted(cu.id,'bday'));
  const debts=custs.filter(cu=>d.debt[cu.id]>0).map(cu=>({cu,amount:d.debt[cu.id]})).sort((a,b)=>b.amount-a.amount);
  const count=remind.length+low.length+nonext.length+recall.length+bday.length;
  return {d,t,appts,custs,todays,revToday,tomorrow,remind,low,nonext,recall,bday,debts,count};
}
let _tc={k:'',v:0};
function todayTaskCount(){const k=mode+S.data.appointments.size+S.data.contacts.size+S.data.courses.size+S.data.customers.size;if(_tc.k!==k)_tc={k,v:todayData().count};return _tc.v}

function viewToday(){
  const {d,t,appts,custs,todays,revToday,tomorrow,remind,low,nonext,recall,bday,debts,count:taskCount}=todayData();
  const arrivedOrDone=todays.filter(a=>a.status==='done'||a.status==='arrived').length;
  const custs0=!custs.length;
  let h=pageHead('today',taskCount?`Có ${taskCount} ${t.cust} cần chăm sóc hôm nay`:'Hôm nay không sót ai','Nhắc lịch, chăm sóc '+t.course.toLowerCase()+', gọi khách quay lại, sinh nhật và công nợ');
  if(custs0)h+=`<div class="infobox">Chưa có dữ liệu. Vào <b>${t.customer}</b> để thêm ${t.cust} đầu tiên, <b>Dịch vụ & gói</b> để thêm dịch vụ, hoặc <b>Cài đặt</b> để nạp lại dữ liệu mẫu.</div>`;
  h+=`<div class="tiles">
    <div class="tile"><span class="v num">${todays.length}</span><span class="l">Lịch hẹn hôm nay</span></div>
    <div class="tile"><span class="v num">${arrivedOrDone}/${todays.length}</span><span class="l">Đã đến</span></div>
    <div class="tile"><span class="v num">${money(revToday)}</span><span class="l">Doanh thu hôm nay</span></div>
    <div class="tile"><span class="v num">${taskCount}</span><span class="l">Việc chăm sóc</span></div></div>`;
  const TABS=[
    ['today','Lịch hôm nay','appts',todays.length,'Toàn bộ lịch hẹn trong ngày, cập nhật trạng thái và thu tiền ngay tại đây'],
    ['remind','Nhắc lịch ngày mai','bell',remind.length,`Lịch ${dm(tomorrow)} chưa được ${t.cust} xác nhận`],
    ['nonext',`${t.course} chưa hẹn ${t.visit} tiếp`,'hourglass',nonext.length,`Có nguy cơ bỏ dở ${t.course.toLowerCase()}`],
    ['low',`Sắp hết ${t.course.toLowerCase()}`,'box',low.length,'Cơ hội tư vấn gia hạn'],
    ['recall',t.recall,'cal',recall.length,t.recallSub],
    ['bday','Sinh nhật 7 ngày tới','promo',bday.length,'Gửi lời chúc và ưu đãi sinh nhật'],
    ['debt','Còn nợ','money',debts.length,`${t.customer} còn khoản chưa thanh toán`]];
  const cur=TABS.find(x=>x[0]===S.todayTab)||TABS[0];
  h+=`<div class="ttabs" role="tablist" aria-label="Đầu công việc hôm nay">${TABS.map(([k,l,ic,n])=>`<button type="button" class="ttab" role="tab" data-act="today-tab" data-v="${k}" aria-selected="${cur[0]===k}"><span class="ttab-top">${I(ic)}<b class="num">${n}</b></span><span class="ttab-l">${esc(l)}</span></button>`).join('')}</div>`;
  const list=(items,rowFn,empty)=>`<div class="list">${items.length?items.map(rowFn).join(''):`<div class="empty">${empty}</div>`}</div>`;
  const av=cu=>`<div class="avatar">${esc(initials(cu.name))}</div>`;
  let body='';
  if(cur[0]==='today'){

function staffBusy(sid,date,time,dur,exclId){if(!sid||!date||!time)return null;const t=toMin(time);
  return all('appointments').filter(a=>a.id!==exclId&&a.staffId===sid&&a.date===date&&a.status!=='cancelled'&&a.status!=='noshow').sort((a,b)=>toMin(a.time)-toMin(b.time)).find(a=>{const st=toMin(a.time);return t<st+apptDur(a)&&st<t+dur})||null}
function freeSlots(sid,date,dur,exclId,from,n){const sh=shiftOn(sid,date);if(sh&&sh.off)return [];
  const open=sh&&!sh.off?toMin(sh.start):8*60,close=sh&&!sh.off?toMin(sh.end):21*60;const nowM=date===TODAY?toMin(nowHM()):0;const out=[];
  let m=Math.max(open,Math.ceil(Math.max(nowM,toMin(from||'00:00')-120)/15)*15);
  for(;m+dur<=close&&out.length<(n||6);m+=15){const tm=hm(m);if(!staffBusy(sid,date,tm,dur,exclId))out.push(tm)}return out}

        const id=pre.id||uid();await put('appointments',id,{...(ed||{}),customerId:cid,serviceId:F.serviceId,staffId:F.staffId,date:F.date,time:F.time,status:ed?ed.status:'booked',courseId:F.courseId||'',note:F.note,createdAt:ed?ed.createdAt:TODAY});

function bindPicker(el,p,F,redraw){

const ATT={present:['Có mặt','C','var(--ok)','st-done'],late:['Đi muộn','M','var(--warn)','st-arrived'],leave:['Nghỉ phép','P','var(--info)','st-confirmed'],absent:['Nghỉ không phép','K','var(--bad)','st-noshow']};
const PALETTE=['#1E7A68','#B0476A','#3563B8','#A8690F','#6B4FB0','#2F8F5B','#C0562F','#4A7A9E'];
const byName=(a,b)=>(a.name||'').localeCompare(b.name||'');
function activeStaff(){return all('staff').filter(s=>s.active!==false).sort(byName)}
const monthKey=d=>d.slice(0,7);
function monthLabel(mk){const p=mk.split('-');return 'Tháng '+Number(p[1])+'/'+p[0]}
function prevMonth(mk){const p=mk.split('-').map(Number);const d=new Date(p[0],p[1]-2,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function daysInMonth(mk){const p=mk.split('-').map(Number);return new Date(p[0],p[1],0).getDate()}
function attDoc(sid,mk){return get('attendance',`${sid}_${mk}`)||{staffId:sid,month:mk,days:{}}}
function attDay(sid,date){return (attDoc(sid,monthKey(date)).days||{})[date.slice(8)]}
async function setAtt(sid,date,part){
  const mk=monthKey(date),doc=attDoc(sid,mk),dd=date.slice(8);
  const days={...(doc.days||{})};const cur={...(days[dd]||{}),...part};
  if(cur.s===null){delete days[dd]}else days[dd]=cur;
  await put('attendance',`${sid}_${mk}`,{staffId:sid,month:mk,days});
}
function nowHM(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function monthStats(sid,mk){
  const days=attDoc(sid,mk).days||{};const c={present:0,late:0,leave:0,absent:0};
  Object.values(days).forEach(x=>{if(x&&c[x.s]!==undefined)c[x.s]++});
  const done=all('appointments').filter(a=>a.staffId===sid&&a.status==='done'&&a.date&&a.date.startsWith(mk));
  const adv=all('advances').filter(a=>a.staffId===sid&&a.date&&a.date.startsWith(mk));
  const tips=all('sales').filter(s=>s.staffId===sid&&s.tip&&monthOf(s.date)===mk).reduce((x,s)=>x+(s.tip||0),0);
  return {...c,tips,cong:c.present+c.late+c.leave,served:done.length,sales:done.reduce((s,a)=>s+(a.value||0),0),commission:done.reduce((s,a)=>s+(a.commission||0),0),adv:adv.reduce((s,a)=>s+(a.amount||0),0),advList:adv};
}
function payroll(s,mk){
  const st=settings(),std=st.workDays||26,pen=st.latePenalty!=null?st.latePenalty:30000;
  const m=monthStats(s.id,mk);
  const byDay=Math.round((s.baseSalary||0)*Math.min(m.cong,std)/std);
  const late=m.late*pen;
  return {...m,std,pen,base:s.baseSalary||0,byDay,latePen:late,net:byDay+m.commission+(m.tips||0)-late-m.adv};
}

/* ---------- XẾP CA ---------- */
const DEFAULT_SHIFTS=[{id:'S',name:'Ca sáng',start:'08:30',end:'14:30',color:'#3563B8'},{id:'C',name:'Ca chiều',start:'14:00',end:'20:30',color:'#A8690F'},{id:'F',name:'Cả ngày',start:'08:30',end:'17:30',color:'#1E7A68'}];
function shiftsList(){const s=settings().shifts;return Array.isArray(s)&&s.length?s:DEFAULT_SHIFTS}
function shiftById(id){return shiftsList().find(x=>x.id===id)}
const shiftShort=sh=>{if(sh.off)return 'Nghỉ';const s=String(sh.name||'').replace(/^Ca\s+/i,'');return s.charAt(0).toUpperCase()+s.slice(1)};
function weekStartOf(d){return addDays(d,-((parseYmd(d).getDay()+6)%7))}
function rosDoc(sid,mk){return get('roster',`${sid}_${mk}`)||{staffId:sid,month:mk,days:{}}}
function rosVal(sid,date){return (rosDoc(sid,monthKey(date)).days||{})[date.slice(8)]||''}
function shiftOn(sid,date){const v=rosVal(sid,date);if(!v)return null;if(v==='off')return {off:true};return shiftById(v)||null}
function shiftStartOf(sid,date){const sh=shiftOn(sid,date);return sh&&!sh.off?sh.start:(settings().shiftStart||'08:30')}
const shiftHours=sh=>sh&&!sh.off?Math.max(0,toMin(sh.end)-toMin(sh.start))/60:0;
function shiftText(sh){return !sh?'Chưa xếp ca':sh.off?'Nghỉ theo lịch ca':`${sh.name} ${sh.start}–${sh.end}`}
function shiftTag(sh){return `<span class="shifttag${sh&&sh.off?' off':''}"><i style="background:${sh&&!sh.off?esc(sh.color||'#999'):'var(--line)'}"></i>${esc(shiftText(sh))}</span>`}
/* trả về '' nếu ổn, 'off' nếu nghỉ, 'out' nếu ngoài giờ ca, null nếu chưa xếp ca */
function shiftCheck(sid,date,time){const sh=shiftOn(sid,date);if(!sh)return null;if(sh.off)return 'off';const t=toMin(time);return (t<toMin(sh.start)||t>=toMin(sh.end))?'out':''}
async function setRosMany(list){
  const docs={};
  list.forEach(({sid,date,val})=>{const mk=monthKey(date),k=`${sid}_${mk}`;if(!docs[k])docs[k]={staffId:sid,month:mk,days:{...(rosDoc(sid,mk).days||{})}};if(val)docs[k].days[date.slice(8)]=val;else delete docs[k].days[date.slice(8)]});
  for(const [k,d] of Object.entries(docs))await put('roster',k,d);
}
function hrRoster(){
  const H0=pageHead('roster','Xếp ca làm việc','Lịch ca theo tuần, dùng để tính đi muộn và cảnh báo khi đặt lịch');
  const W=S.hr.week,days=[0,1,2,3,4,5,6].map(i=>addDays(W,i)),staff=activeStaff(),shifts=shiftsList(),thisW=weekStartOf(TODAY);
  if(!S.hr.brush||(S.hr.brush!=='off'&&!shiftById(S.hr.brush)))S.hr.brush=shifts[0].id;
  const B=S.hr.brush;
  const brush=(k,l,c)=>`<button class="chip" type="button" data-act="ros-brush" data-b="${esc(k)}" aria-pressed="${B===k}"><i class="staff-dot" style="background:${c}"></i>${l}</button>`;
  let h=H0+`<div class="head"><div><h2 style="font-size:18px">Tuần ${dm(days[0])} – ${dm(days[6])}/${days[6].slice(0,4)}</h2><span class="muted" style="font-size:13px">Chọn loại ca, rồi bấm vào ô để xếp. Bấm lại ô đó để xóa.</span></div>
   <div class="chips"><button class="chip" type="button" data-act="ros-week" data-n="-7">‹ Tuần trước</button><button class="chip" type="button" data-act="ros-week" data-n="0" aria-pressed="${W===thisW}">Tuần này</button><button class="chip" type="button" data-act="ros-week" data-n="7">Tuần sau ›</button></div></div>
   <div class="chips" style="margin-bottom:12px">${shifts.map(s=>brush(s.id,`${esc(s.name)} <span class="num" style="font-weight:500">${esc(s.start)}–${esc(s.end)}</span>`,esc(s.color||'#999'))).join('')}${brush('off','Nghỉ','var(--line)')}</div>`;
  let g=`<table class="attgrid rosgrid"><thead><tr><th class="sticky">Nhân viên</th>${days.map(d=>`<th class="${d===TODAY?'sel':''}"><div>${WD[parseYmd(d).getDay()]}<small>${dm(d)}</small></div></th>`).join('')}<th>Giờ/mục tiêu</th></tr></thead><tbody>`;
  const working=days.map(()=>0),violations=[];
  staff.forEach(s=>{let hrs=0;g+=`<tr><th class="sticky">${esc(s.name)}</th>`;
    days.forEach((d,i)=>{const sh=shiftOn(s.id,d);hrs+=shiftHours(sh);if(sh&&!sh.off)working[i]++;
      const rq=reqDay(s.id,d),vio=reqViolation(s.id,d);if(vio)violations.push({s,d,vio});
      const cls=(!sh?'':sh.off?' off':' on')+(vio?' bad':''),lab=!sh?(rq&&rq.off?'Xin nghỉ':'+'):`${esc(shiftShort(sh))}${sh.off?'':`<small class="num">${esc(sh.start)}–${esc(sh.end)}</small>`}`;
      const mark=rq?(rq.off?'<i class="rqmark off" title="Đã xin nghỉ">✋</i>':`<i class="rqmark" title="Không làm được: ${esc(rq.block.map(id=>(shiftById(id)||{name:id}).name).join(', '))}">⛔</i>`):'';
      g+=`<td><button type="button" class="roscell${cls}${!sh&&rq&&rq.off?' reqoffcell':''}" data-act="ros-cell" data-sid="${s.id}" data-d="${d}" style="--c:${sh&&!sh.off?esc(sh.color||'#999'):'transparent'}" aria-label="${esc(s.name)} ${WD[parseYmd(d).getDay()]} ${dm(d)}: ${esc(shiftText(sh))}${vio?' – '+esc(vio):''}" ${vio?`title="${esc(s.name)} ${esc(vio)}"`:''}>${mark}${lab}</button></td>`});
    const tg=staffPref(s.id,W).target;g+=`<td class="num"><b style="color:${hrs>tg+8||hrs<tg-6?'var(--warn)':'inherit'}">${Math.round(hrs*10)/10}</b><small class="tg">/${tg}</small></td></tr>`});
  g+=`</tbody><tfoot><tr><th class="sticky">Số người đi làm</th>${working.map(n=>`<td class="num${n?'':' zero'}">${n}</td>`).join('')}<td></td></tr></tfoot></table>`;
  h+=`<section class="panel"><div class="panel-h"><h2>Lịch ca tuần</h2><span class="count num">${staff.length}</span></div>${staff.length?`<div style="overflow-x:auto">${g}</div>`:'<div class="empty">Chưa có nhân viên.</div>'}
   <div class="btn-grid" style="padding:12px 14px"><button class="btn primary" type="button" data-act="ros-propose">🎲 Đề xuất lịch tuần</button><button class="btn" type="button" data-act="ros-copy">Chép lịch tuần trước</button><button class="btn" type="button" data-act="ros-fill">Điền ô trống bằng ca đang chọn</button><button class="btn" type="button" data-act="ros-send">Chép lịch ca (gửi Zalo nhóm)</button></div>
   <div class="panel-sub" style="padding:0 14px 12px">✋ = đã xin nghỉ · ⛔ = có ca không làm được · ô viền đỏ = đang xếp trái đăng ký. Giờ vào ca của từng người được dùng để tính đi muộn khi chấm công.</div></section>`;
  if(violations.length)h+=`<div class="errbox"><b>${violations.length} ô đang xếp trái đăng ký của nhân viên:</b>${violations.map(v=>`<span>${esc(v.s.name)} · ${WD[parseYmd(v.d).getDay()]} ${dm(v.d)}: ${esc(v.vio)}</span>`).join('')}</div>`;
  h+=reqPanel(W);
  const issues=all('appointments').filter(a=>a.date>=days[0]&&a.date<=days[6]&&a.date>=TODAY&&(a.status==='booked'||a.status==='confirmed')).map(a=>({a,c:shiftCheck(a.staffId,a.date,a.time)})).filter(x=>x.c==='off'||x.c==='out').sort((x,y)=>(x.a.date+x.a.time).localeCompare(y.a.date+y.a.time));
  if(issues.length)h+=`<section class="panel"><div class="panel-h"><span class="dot" style="background:var(--warn)"></span><h2>Lịch hẹn lệch với lịch ca</h2><span class="count num">${issues.length}</span></div><div class="list">${issues.map(({a,c})=>{const st=staffOf(a.staffId),sh=shiftOn(a.staffId,a.date);return `<div class="row clickable" data-act="appt" data-id="${a.id}"><span class="time num" style="min-width:52px">${esc(a.time)}<small style="display:block;font-size:11px;color:var(--muted)">${WD[parseYmd(a.date).getDay()]} ${dm(a.date)}</small></span><div class="row-main"><b>${esc(custName(a.customerId))}</b><span>${esc(serviceName(a.serviceId))} · ${esc(st.name)} ${c==='off'?'nghỉ ngày này':'làm '+esc(sh.name.toLowerCase())+' '+esc(sh.start)+'–'+esc(sh.end)}</span></div><span class="pill st-arrived">${c==='off'?'Nhân viên nghỉ':'Ngoài giờ ca'}</span></div>`}).join('')}</div></section>`;
  return h;
}
function copyRoster(){
  const W=S.hr.week,days=[0,1,2,3,4,5,6].map(i=>addDays(W,i)),staff=activeStaff();
  const lines=[`${settings().name} – Lịch ca tuần ${dm(days[0])} – ${dm(days[6])}`];
  days.forEach(d=>{const on=[],off=[];staff.forEach(s=>{const sh=shiftOn(s.id,d);if(!sh)return;if(sh.off)off.push(s.name);else on.push(`${s.name} (${shiftShort(sh).toLowerCase()} ${sh.start}–${sh.end})`)});
    lines.push(`${WD[parseYmd(d).getDay()]} ${dm(d)}: ${on.length?on.join(', '):'chưa xếp ca'}${off.length?' · Nghỉ: '+off.join(', '):''}`)});
  const txt=lines.join('\n');
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Đã chép lịch ca, dán vào Zalo nhóm để gửi'),()=>toast('Trình duyệt không cho chép, hãy chụp màn hình.'));
}

function loadUsers(){try{const u=JSON.parse(localStorage.getItem('vua-users')||'null');return Array.isArray(u)&&u.length?u:null}catch(e){return null}}
function saveUsers(list){try{localStorage.setItem('vua-users',JSON.stringify(list))}catch(e){}}
function allUsers(){
  let u=loadUsers();
  if(!u){u=DEFAULT_USERS.map(x=>({...x}));saveUsers(u);return u}
  let changed=false;
  DEFAULT_USERS.forEach(d=>{
    const i=u.findIndex(x=>x.username===d.username);
    if(i===-1){u.push({...d});changed=true}
    else if(d.staffId&&!u[i].staffId){u[i]={...u[i],staffId:d.staffId};changed=true}
  });
  if(changed)saveUsers(u);
  return u;
}

function applyTheme(){
  const st=settings();let acc=st.accent,th=st.theme;
  try{acc=acc||localStorage.getItem('vua-accent');th=th||localStorage.getItem('vua-theme')}catch(e){}
  const r=document.documentElement;
  if(acc&&acc!=='rose')r.dataset.accent=acc;else delete r.dataset.accent;

/* ---------- generic form sheet ---------- */
/* fields: {k,l,type:text|money|number|date|time|select|textarea|check|tel|email, opts:[[v,l]], ph, req, row} */
function formSheet(o){
  const d=o.data||{};let html='',i=0;const F=o.fields;
  const fh=f=>{const id='ff-'+f.k,v=d[f.k]??f.def??'';
    if(f.type==='check')return `<label style="display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px"><input type="checkbox" id="${id}" ${v?'checked':''}> ${f.l}</label>`;
    let inp;
    if(f.type==='select')inp=`<select class="input" id="${id}">${f.opts.map(([ov,ol])=>`<option value="${esc(ov)}" ${String(ov)===String(v)?'selected':''}>${esc(ol)}</option>`).join('')}</select>`;
    else if(f.type==='textarea')inp=`<textarea class="input" id="${id}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
    else{const t=f.type==='money'||f.type==='number'?'text':f.type||'text';inp=`<input class="input${f.type==='money'||f.type==='number'?' num':''}" id="${id}" type="${t}" ${f.type==='money'||f.type==='number'?'inputmode="numeric"':''} value="${esc(v)}" placeholder="${esc(f.ph||'')}" ${f.req?'required':''}>`}
    return `<div class="field"><label for="${id}">${f.l}${f.req?' *':''}</label>${inp}</div>`};
  while(i<F.length){const f=F[i];if(f.row){const grp=F.slice(i).filter((x,j)=>j<3&&x.row===f.row);let n=0;while(i+n<F.length&&F[i+n].row===f.row)n++;const g=F.slice(i,i+n);html+=`<div class="${g.length>2?'form-row3':'form-row'}">${g.map(fh).join('')}</div>`;i+=n}else{html+=fh(f);i++}}
  openSheet(`<div class="sheet-h"><h2>${o.title}</h2><button class="btn sm ghost" type="button" data-act="close">Đóng</button></div>
   <form class="form" id="gform">${o.before||''}${html}${o.after||''}<button class="btn primary" type="submit">${o.submit||'Lưu'}</button></form>`,el=>{
    el.querySelector('#gform').addEventListener('submit',async e=>{e.preventDefault();const v={};
      for(const f of F){const x=el.querySelector('#ff-'+f.k);if(!x)continue;v[f.k]=f.type==='check'?x.checked:(f.type==='money'||f.type==='number')?numIn(x.value):x.value.trim();if(f.req&&(v[f.k]===''||v[f.k]==null))return toast('Nhập '+f.l.toLowerCase()+'.')}
      const r=await o.onSave(v,el);if(r!==false)closeSheet()});
    const first=el.querySelector('#gform input,#gform select,#gform textarea');if(first&&window.innerWidth>700)first.focus();
    if(o.onMount)o.onMount(el);
  });
  S.sheetView=null;
}

/* ---------- data table ---------- */
const TABLES={};
function dataTable(c){
  const key=c.key;const q=norm(S.tq[key]||'').trim();
  let rows=c.rows.slice();
  if(q)rows=rows.filter(r=>norm(c.cols.map(col=>col.x?col.x(r):stripTags(col.v(r))).join(' ')).includes(q));
  const so=S.sort[key];
  if(so&&c.cols[so.i]){const col=c.cols[so.i],f=col.s||col.x||(r=>stripTags(col.v(r)));rows.sort((a,b)=>{const x=f(a),y=f(b);return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'vi',{numeric:true}))*so.d})}
  TABLES[key]={c,rows};
  const sel=rows.some(r=>r.id===S.sel[key])?S.sel[key]:'';
  const b=(cls,act,ic,l,dis,ex)=>`<button class="tbtn ${cls}" type="button" data-act="${act}" data-k="${key}" ${ex||''} ${dis?'disabled':''}>${I(ic)}${l}</button>`;
  let h=`<div class="toolbar">${c.add?b('add','t-add','plus',c.addLabel||'Thêm mới'):''}${c.view?b('view','t-view','eye','Xem chi tiết',!sel):''}${c.edit?b('edit','t-edit','edit','Sửa',!sel):''}${c.del?b('del','t-del','trash','Xóa',!sel):''}${(c.extra||[]).map(x=>b(x.cls||'view','t-x',x.icon||'plus',x.l,x.needSel&&!sel,`data-x="${x.id}"`)).join('')}<span class="grow"></span>${c.noExport?'':b('pdf','t-exp','pdf','PDF',0,'data-f="pdf"')+b('xls','t-exp','xls','Excel',0,'data-f="xls"')+b('csv','t-exp','csv','CSV',0,'data-f="csv"')}</div>`;
  if(c.filters)h+=c.filters;
  if(!c.noSearch)h+=`<div class="tsearch"><label for="tq-${key}">${I('search')}Tìm:</label><input class="input" id="tq-${key}" autocomplete="off" value="${esc(S.tq[key]||'')}" placeholder="${esc(c.ph||'Gõ để tìm…')}"></div>`;
  h+=`<div class="dt-wrap"><table class="dt"><thead><tr>${c.cols.map((col,i)=>`<th class="${col.cls&&col.cls.split(' ').includes('r')?'r':''}"><button type="button" data-act="t-sort" data-k="${key}" data-i="${i}">${col.l}${so&&so.i===i?(so.d>0?' ▲':' ▼'):''}</button></th>`).join('')}</tr></thead><tbody>`;
  h+=rows.length?rows.map(r=>`<tr data-act="t-row" data-k="${key}" data-id="${esc(r.id)}" class="${r.id===sel?'sel':''}" ${c.rowStyle?`style="${c.rowStyle(r)}"`:''}>${c.cols.map(col=>`<td class="${col.cls||''}">${col.v(r)}</td>`).join('')}</tr>`).join(''):`<tr><td class="empty" colspan="${c.cols.length}">${c.empty||'Chưa có dữ liệu.'}</td></tr>`;
  h+=`</tbody>${c.foot&&rows.length?`<tfoot><tr>${c.foot(rows)}</tr></tfoot>`:''}</table></div>`;
  h+=`<div class="dt-foot"><span>${rows.length} dòng${q?' khớp “'+esc(S.tq[key])+'”':''}</span><span>Bấm 1 lần để chọn, bấm lần nữa để mở.</span></div>`;
  return h;
}
function tableAct(a,ds){
  const T0=TABLES[ds.k];if(!T0)return;const c=T0.c,sel=S.sel[ds.k];
  if(a==='t-row'){if(S.sel[ds.k]===ds.id&&(c.open||c.view||c.edit)){(c.open||c.view||c.edit)(ds.id)}else{S.sel[ds.k]=ds.id;render()}return}
  if(a==='t-add')return c.add();
  if(a==='t-edit'&&sel)return c.edit(sel);
  if(a==='t-view'&&sel)return (c.view||c.open)(sel);
  if(a==='t-del'&&sel){const r=T0.rows.find(x=>x.id===sel);return confirmSheet('Xóa dữ liệu?',`Xóa <b>${esc(c.delName?c.delName(r):(r&&r.name)||'dòng đã chọn')}</b>? Không thể hoàn tác.`,'Xóa',async()=>{await c.del(sel);S.sel[ds.k]='';toast('Đã xóa')})}
  if(a==='t-x'){const x=(c.extra||[]).find(e=>e.id===ds.x);if(x)x.run(sel);return}
  if(a==='t-sort'){const i=Number(ds.i),cur=S.sort[ds.k];S.sort[ds.k]={i,d:cur&&cur.i===i?-cur.d:1};render();return}
  if(a==='t-exp')return exportTable(ds.k,ds.f);
}

/* ---------- export ---------- */
let dlNs;
async function downloadFile(name,content,type){
  const blob=content instanceof Blob?content:new Blob([content],{type});
  const c=window.claude;
  if(c&&typeof c.use==='function'){if(dlNs===undefined){try{dlNs=await c.use('downloads')}catch(e){dlNs=null}}
    if(dlNs){try{await dlNs.save({filename:name,data:blob});toast('Đã lưu '+name)}catch(e){const code=e&&e.code;toast(code==='declined'?'Đã hủy tải file.':code==='rejected_extension'||code==='extension_not_enabled'?'Định dạng này không tải được ở đây, hãy dùng CSV.':code==='rate_limited'?'Đang có hộp thoại tải file, thử lại sau.':'Không tải được file ở chế độ xem này.')}return}}
  try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500);toast('Đã tải '+name)}
  catch(e){toast('Trình duyệt chặn tải file.')}
}

function barChartSVG(data,o){
  o=o||{};const W=720,H=o.h||240,ml=52,mr=8,mt=12,mb=26,iw=W-ml-mr,ih=H-mt-mb;
  const mx=Math.max(1,...data.map(d=>d.v));const step=Math.pow(10,Math.floor(Math.log10(mx)));const nice=[1,2,2.5,5,10].map(m=>m*step).find(m=>m*4>=mx)||step*10;const top=nice*4;
  const bw=iw/data.length,w=Math.max(4,Math.min(34,bw*.62));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Biểu đồ cột')}">`;
  for(let i=0;i<=4;i++){const y=mt+ih-ih*i/4;s+=`<line class="gl" x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}"/><text class="ax" x="${ml-8}" y="${y+3.5}" text-anchor="end">${i?short(nice*i):'0'}</text>`}
  data.forEach((d,i)=>{const x=ml+bw*i+(bw-w)/2,hh=d.v?Math.max(2,ih*d.v/top):0,y=mt+ih-hh,r=Math.min(4,w/2,hh);
    const path=hh?`M${x},${mt+ih}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${mt+ih}Z`:'';
    s+=`<g data-tip="${esc(d.tip||money(d.v))}" data-tip2="${esc(d.l2||d.l)}"><rect class="hit" x="${ml+bw*i}" y="${mt}" width="${bw}" height="${ih}"/>${path?`<path class="bar${d.dim?' dim':''}" d="${path}"/>`:''}</g>`;
    if(data.length<=16||i%2===0)s+=`<text class="ax" x="${ml+bw*i+bw/2}" y="${H-8}" text-anchor="middle">${esc(d.l)}</text>`});
  return s+`</svg>`;
}
function donutSVG(parts,total,center){
  const R=80,r=52,cx=95,cy=95;let a0=-Math.PI/2,s=`<svg viewBox="0 0 190 190" role="img" aria-label="Biểu đồ tròn">`;
  if(!total)s+=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="var(--surface-2)" stroke-width="${R-r}"/>`;
  parts.forEach(p=>{const a=p.v/total*Math.PI*2;if(a<=0)return;const a1=a0+a;const lg=a>Math.PI?1:0;const P=(rad,ang)=>[cx+rad*Math.cos(ang),cy+rad*Math.sin(ang)].map(n=>n.toFixed(2)).join(' ');

    s+=`<path d="${d}" fill="${p.c}" stroke="var(--surface)" stroke-width="2" fill-rule="evenodd" data-tip="${esc(p.l)}: ${esc(money(p.v))}" data-tip2="${Math.round(p.v/total*100)}%"/>`;a0=a1});
  return s+`<text x="${cx}" y="${cy-2}" text-anchor="middle" style="font:800 17px var(--font);fill:var(--ink)">${esc(center||short(total))}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" style="font:500 11px var(--font);fill:var(--muted)">tổng</text></svg>`;

function newCart(){return {items:[],customerId:'',q:'',adding:false,newName:'',newPhone:'',staffId:'',discPct:'',promoCode:'',promoId:'',taxPct:String(settings().taxPct||0),tip:'',method:'cash',paid:'',appointmentId:'',note:''}}
function promoValid(p,sub){return p&&p.active!==false&&(!p.start||p.start<=TODAY)&&(!p.end||p.end>=TODAY)&&(!p.minSpend||sub>=p.minSpend)}
function cartCalc(C){
  const sub=C.items.reduce((s,i)=>s+i.price*i.qty,0);const disc=Math.round(sub*Math.min(100,numIn(C.discPct))/100);
  const pr=C.promoId&&get('promos',C.promoId);let promoDisc=0;
  if(pr&&promoValid(pr,sub))promoDisc=pr.type==='pct'?Math.round((sub-disc)*pr.value/100):Math.min(sub-disc,pr.value||0);
  const after=sub-disc-promoDisc,tax=Math.round(after*numIn(C.taxPct)/100),tip=numIn(C.tip),total=after+tax+tip;
  const paid=C.paid===''?total:Math.min(total,numIn(C.paid));
  return {sub,disc,promoDisc,promo:pr,discount:disc+promoDisc,after,tax,tip,total,paid,owe:total-paid};
}

async function cartPay(){

function invoiceSheet(id){
  const s=get('sales',id);if(!s){closeSheet();return}const p=saleParts(s);
  openSheet(`<div class="sheet-h"><h2>${esc(invNo(s))}</h2>${p.owe>0?`<span class="tag debt">Còn nợ</span>`:'<span class="pill st-done">Đã trả đủ</span>'}<button class="btn sm ghost" type="button" data-act="close">Đóng</button></div>
   <div class="panel" style="padding:16px">${receiptHTML(s)}</div>
   <div class="btn-grid"><button class="btn primary" type="button" data-act="inv-print" data-id="${id}">${I('print')}In / Lưu PDF</button>${p.owe>0?`<button class="btn" type="button" data-act="debt-pay" data-id="${id}">Thu nợ ${money(p.owe)}</button>`:''}${s.customerId?`<button class="btn" type="button" data-act="cust" data-id="${s.customerId}">Hồ sơ ${T().cust}</button>`:''}</div>`);
  S.sheetView=()=>{if(get('sales',id))invoiceSheet(id)};
}
function inRange(d,r){if(!d)return false;if(r==='today')return d===TODAY;if(r==='7')return d>=addDays(TODAY,-6)&&d<=TODAY;if(r==='month')return monthOf(d)===CUR_M;if(r==='prev')return monthOf(d)===prevMonth(CUR_M);return true}

/* ---------- BOOKING CALENDAR (week / day) ---------- */
function viewCal(){
  const V=S.calV;
  let h=pageHead('cal','Lịch đặt chỗ',V==='week'?'Tổng quan lịch hẹn theo tuần, bấm vào ô trống để đặt lịch':'Lịch hẹn theo ngày và theo '+T().staff.toLowerCase(),segRow('cal-v',V,[['week','Theo tuần'],['day','Theo ngày']]));
  if(V==='day')return h+viewAppts();
  const W=S.calW,days=[0,1,2,3,4,5,6].map(i=>addDays(W,i)),stf=S.calStaff;
  let ap=all('appointments').filter(a=>a.date>=days[0]&&a.date<=days[6]);if(stf!=='all')ap=ap.filter(a=>a.staffId===stf);
  let h0=8,h1=20;ap.forEach(a=>{const hh=Math.floor(toMin(a.time)/60);h0=Math.min(h0,hh);h1=Math.max(h1,hh)});
  const nb=(act,n,l,cls)=>`<button class="tbtn ${cls}" type="button" data-act="${act}" data-n="${n}">${l}</button>`;
  h+=`<div class="toolbar">${nb('cal-w',-7,'◀ Tuần trước','edit')}${nb('cal-w',0,I('appts')+'Tuần này','pdf')}${nb('cal-w',7,'Tuần sau ▶','edit')}<b style="color:var(--accent);font-size:18px;margin-left:8px">${dm(days[0])} – ${dm(days[6])}/${days[6].slice(0,4)}</b><span class="grow"></span><span class="muted" style="font-size:13px">${ap.filter(a=>a.status!=='cancelled').length} lịch trong tuần</span></div>
   <div class="chips">${Object.entries(STATUS).map(([k,l])=>`<span class="ev ${k}" style="cursor:default;font-weight:700;padding:5px 11px">${l}</span>`).join('')}</div>
   <div class="chips"><button class="chip" type="button" data-act="cal-staff" data-id="all" aria-pressed="${stf==='all'}">Tất cả ${T().staff.toLowerCase()}</button>${activeStaff().map(s=>`<button class="chip" type="button" data-act="cal-staff" data-id="${s.id}" aria-pressed="${stf===s.id}"><i class="staff-dot" style="background:${esc(s.color)}"></i>${esc(s.name)}</button>`).join('')}</div>`;
  let g=`<div class="cal-wrap"><div class="cal"><div class="ch">Giờ</div>${days.map(d=>`<div class="ch ${d===TODAY?'today':''}">${WD[parseYmd(d).getDay()]} ${Number(d.slice(8))}/${Number(d.slice(5,7))}</div>`).join('')}`;
  for(let hr=h0;hr<=h1;hr++){g+=`<div class="th">${pad(hr)}:00</div>`;
    days.forEach(d=>{const list=ap.filter(a=>a.date===d&&Math.floor(toMin(a.time)/60)===hr).sort((a,b)=>toMin(a.time)-toMin(b.time));
      g+=`<div class="cc ${d<TODAY?'past':''}" data-act="cal-new" data-d="${d}" data-h="${pad(hr)}:00">${list.map(a=>`<button type="button" class="ev ${a.status}" data-act="appt" data-id="${a.id}" title="${esc(custName(a.customerId)+' · '+serviceName(a.serviceId)+' · '+staffOf(a.staffId).name)}"><b>${esc(a.time)} ${esc(custName(a.customerId))}</b><span>${esc(serviceName(a.serviceId))}</span><span><i class="staff-dot" style="background:${esc(staffOf(a.staffId).color)}"></i>${esc(staffOf(a.staffId).name)}</span></button>`).join('')}</div>`})}
  g+=`</div></div>`;
  return h+g+`<button class="btn primary fab" type="button" data-act="new-appt">+ Đặt lịch</button>`;
}

async function syncLeads(){
  toast('Đang đồng bộ lead…');
  try{
    const r=await fetch('/api/leads?mode='+mode);
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'Lỗi không xác định');
    const leads=j.leads||[];
    if(!leads.length){toast('Không có lead mới.');return}
    const ids=[];
    for(const lead of leads){
      const noteParts=[];
      if(lead.service)noteParts.push('Quan tâm: '+lead.service);
      if(lead.note)noteParts.push(lead.note);
      noteParts.push('Nguồn: '+(SOURCE_LABEL[lead.source]||lead.source||'Website'));
